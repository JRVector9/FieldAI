function article3(){const cid=route.split('/')[2]||b3().selectedCampaign||b3().campaigns[0]?.id;const creative=campaign(cid)?.live;return `<div class="v3-magazine"><div class="v3-mag-body"><nav class="v3-mag-nav"><span class="v3-mag-brand">${esc(b3().publisher.name)}</span><span class="small muted">LIVING & PEOPLE · 콘텐츠 시안</span>${goBtn('사업자 사이트',vf().published?'customer/home':'agent/chat','btn-ghost','external')}</nav><header class="v3-article-head"><div class="v3-kicker">A LITTLE MORE TIME FOR YOU</div><h1>바쁜 일상에 필요한 서비스,<br>궁금한 것부터 물어보세요.</h1><p>콘텐츠에서 발견하고, AI와 확인하고, 사장님에게 연결됩니다.</p></header><div class="v3-article-grid"><article class="v3-article-copy"><div class="v3-article-art">새로운 일상의 여유.</div><p>일상에서 필요한 서비스를 찾을 때, 소개만 읽고 바로 결정하기는 어렵습니다. 내 지역에서도 가능한지, 어떤 서비스를 선택해야 하는지 확인하고 싶은 순간이 생깁니다.</p><h2>질문에서 시작하는 선택.</h2><p>옆의 대화형 카드는 ${esc(ownerName())}를 소개하는 광고 시안입니다. 서비스와 지역에 관해 물어보고, 실제 상담이 필요해지면 해당 사업자에게 문의를 전달할 수 있습니다.</p><p>AI의 안내와 예약 확정은 다릅니다. 방문 조건과 최종 일정은 사장님이 직접 확인합니다.</p><div class="v3-soft">이 글과 매체는 사용자 경험 검토를 위한 가상 예시입니다. 실제 매체 게재나 광고 집행이 아닙니다.</div></article>${ad3(cid,'article')}</div></div></div>`;}
function agentPublic3(){const cid=route.split('/')[2]||'own';return `<div class="v3-agent-public"><header class="v3-agent-public-head"><div class="row"><div class="v3-agent-logo">${icon('sparkle')}</div><div><strong>${esc(ownerName())}</strong><p class="small muted mt8">사업자 공식 AI 안내 · 시안</p></div></div>${vf().published?goBtn('홈페이지 보기','customer/home','btn-secondary','external'):badge('AI 단독 상담','blue')}</header><main class="v3-agent-public-main"><div class="v3-kicker">어디에서 오셨든, 여기서 이어가세요.</div>${ad3(cid==='own'?null:cid,'link')}<div class="v3-privacy">${icon('lock','i16')}일반 질문은 연락처 없이 이용합니다. 실제 문의·예약 요청 때만 이름과 연락처를 남깁니다.</div></main></div>`;}
function ensureSession3(cid,context){if(cid==='own')cid=null;const prev=b3().activeSession&&b3().conversations[b3().activeSession];if(prev&&prev.campaignId===cid&&prev.context===context&&!prev.submitted)return prev;const s={id:uid('eng'),campaignId:cid,context,placementId:context==='article'?b3().placements.find(p=>p.campaignId===cid&&p.status==='approved')?.id:null,messages:[],started:false,submitted:false};b3().conversations[s.id]=s;b3().activeSession=s.id;save();return s;}
function availableDeployment3(cid,context){const c=campaign(cid);return activeAgent()&&(!c||c.status==='active')&&(context!=='article'||b3().placements.some(p=>p.campaignId===cid&&p.status==='approved'&&p.revision===c?.revision&&b3().publisher.slots.some(x=>x.id===p.slotId&&x.active)));}
function askAd3(cid,context,text){if(!availableDeployment3(cid,context)){toast('AI 안내가 중지되어 있어요.');return;}const c=campaign(cid);if(c&&c.status!=='active'){toast('홍보 카드가 활성 상태가 아닙니다.');return;}const s=ensureSession3(cid,context);if(!s.started){s.started=true;track3('conversation_started',{sessionId:s.id,campaignId:s.campaignId,placementId:s.placementId});}s.messages.push({by:'customer',text});s.messages.push({by:'ai',text:safeAnswer3(text,c?.live?.serviceId)});save();render();document.querySelector('.v3-dialogue')?.scrollTo(0,99999);}
function intake3(booking=false){const d=b3().intakeDraft,src=b3().intakeSource,s=service3(d.service),mode=s.mode||'preferred';if(!facts())return empty3('먼저 사업체를 준비해 주세요.','예시 사업체를 불러오거나 새로 개설하면 고객 접수 화면을 볼 수 있습니다.',btn('예시 체험','v3-demo','btn-primary'));return customerShell(`<main class="v3-intake"><div class="v3-subnav"><button class="${!booking?'active':''}" data-action="v3-intake-type" data-type="inquiry">일반 문의</button><button class="${booking?'active':''}" data-action="v3-intake-type" data-type="booking">예약 요청</button>${goBtn('AI에게 질문','agent/chat','btn-ghost')}</div><h1>${booking?'예약을 요청해 주세요.':'궁금한 내용을 남겨주세요.'}</h1><p class="muted mb16">${booking?'요청을 보내면 사장님이 확인한 뒤 확정합니다.':'사장님이 확인하고 같은 대화에서 답변합니다.'}</p>${src?`<div class="v3-soft mb16">${icon('link','i16')} ${esc(src.label)}에서 이어진 문의 · 앞에서 나눈 대화가 함께 전달됩니다.</div>`:''}<div class="v3-contact-grid"><form class="v3-card v3-form-stack" data-form="v3-intake"><input type="hidden" name="booking" value="${booking?'yes':'no'}">${field('서비스',`<select class="select" name="service" data-intake="service">${allServices().map(v=>`<option value="${v.id}" ${v.id===s.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`)}${booking?`<div class="v3-soft">${mode==='slot'?'시간표 선택형 · 확정 일정과 수동 차단을 반영합니다.':'희망시간 제출형 · 사장님과 일정을 조율합니다.'}</div>${field('희망 날짜',`<input class="input" name="date" type="date" data-intake="date" value="${esc(d.date)}" min="${isoToday()}" max="${addDays(isoToday(),60)}" required>`)}${mode==='slot'?`<div><label class="field-label">요청할 시간</label><div class="v3-slots mt16">${slotTimes3(d.date,s).map(x=>`<button type="button" class="${d.time===x.time?'chosen':''}" ${x.free?'':'disabled'} data-action="v3-pick-time" data-time="${x.time}">${x.time}</button>`).join('')}</div><input type="hidden" name="time" value="${esc(d.time)}"></div>`:field('희망 시간',`<input class="input" name="time" type="time" data-intake="time" value="${esc(d.time)}" required>`)}`:''}<div class="form-grid">${field('이름',`<input class="input" name="name" data-intake="name" value="${esc(d.name)}" required maxlength="40" autocomplete="name" placeholder="이름을 입력해 주세요">`)}${field('휴대전화',`<input class="input" name="phone" data-intake="phone" value="${esc(d.phone)}" required inputmode="tel" autocomplete="tel" placeholder="010-0000-0000">`)}</div>${field('내용',`<textarea name="message" data-intake="message" required placeholder="서비스 조건이나 요청사항을 알려주세요.">${esc(d.message)}</textarea>`)}${field('지역·이용 장소 (선택)',`<input class="input" name="region" data-intake="region" value="${esc(d.region)}" placeholder="상세 주소는 조율 단계에서 남겨주세요">`)}<div><label class="upload-zone">${icon('image')}사진 첨부 (최대 5장)<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-v3-attachments hidden></label><div class="v3-image-list">${(d.photos||[]).map(p=>`<img src="${p.data}" alt="${esc(p.name)}">`).join('')}</div></div><label class="v3-check"><input type="checkbox" name="privacy" required>문의 처리·회신을 위해 입력한 정보를 ${esc(ownerName())}에 전달합니다. 이 시안에는 실제 개인정보를 입력하지 마세요.</label><p class="small muted">회원가입·번호 인증 없이 접수됩니다. 번호가 정확한지 확인해 주세요.</p><button class="btn btn-primary btn-lg" type="submit">${booking?'예약 요청 보내기':'문의 보내기'} ${icon('arrow')}</button></form><aside class="v3-card"><h2>${esc(ownerName())}</h2><div class="summary-line mt16"><span>선택 서비스</span><strong>${esc(s.name)}</strong></div><div class="summary-line"><span>가격 안내</span><strong>${s.price?money(s.price)+'원부터':'상담 후 견적'}</strong></div><div class="summary-line"><span>활동 지역</span><strong>${esc(facts().region)}</strong></div><div class="summary-line"><span>운영시간</span><strong>${esc(facts().hours)}</strong></div><div class="v3-soft mt24">${booking?'예약 요청은 확정과 다릅니다. 사장님의 확인을 기다려 주세요.':'AI가 답변할 수 없는 내용도 사장님이 직접 확인합니다.'}</div><p class="v3-note-plain">답변 알림은 카카오톡 우선, 발송 실패 시 문자로 대체하는 설계입니다. 현재 파일은 외부 발송을 하지 않습니다.</p></aside></div></main>`);}
function slotTimes3(date,s){const out=[];for(let h=9;h<18;h++)for(const m of [0,30]){const t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');if(h*60+m+s.duration<=18*60)out.push({time:t,free:!conflict3(date,t,s.duration)});}return out;}
function conflict3(iso,time,duration,ignoreId=null){const a=timeNum(time),z=a+Number(duration);return [...state.bookings,...state.manual].filter(e=>e.id!==ignoreId).some(e=>{const match=e.isoDate?e.isoDate===iso:e.date===Number(iso.slice(-2));return match&&a<timeNum(e.end||timeAdd(e.time,e.duration||60))&&z>timeNum(e.time);});}
function calendar3(){const date=b3().calendarDate,items=[...state.bookings,...state.manual].filter(x=>x.isoDate===date||(!x.isoDate&&x.date===Number(date.slice(-2)))).sort((a,b)=>a.time.localeCompare(b.time));return `${heading('예약·일정','홈페이지·공유 링크·홍보 카드의 요청을 같은 일정에서 관리합니다.',btn('수동 일정 등록','v3-manual','btn-primary','plus'))}<div class="v3-grid2"><section class="v3-card"><div class="row-between"><button class="iconbtn" data-action="v3-date-prev" aria-label="이전 날짜">${icon('left')}</button><h2>${dateLabel(date)}</h2><button class="iconbtn" data-action="v3-date-next" aria-label="다음 날짜">${icon('chevron')}</button></div><div class="row mt16"><input type="date" class="input" value="${date}" data-calendar-date aria-label="일정 날짜"></div>${items.length?items.map(x=>`<div class="v3-list-row"><div class="v3-link-icon">${icon('calendar')}</div><div class="grow"><strong>${x.time}–${x.end||timeAdd(x.time,x.duration||60)}</strong><p>${esc(x.name||x.title)}${x.service?' · '+esc(service3(x.service).name):''}</p></div>${badge(x.manual?'수동 차단':'확정',x.manual?'gray':'blue')}${x.manual?`<button class="btn-link" data-action="v3-delete-manual" data-id="${x.id}">삭제</button>`:''}</div>`).join(''):`<div class="empty">${icon('calendar')}<h3>확정된 일정이 없습니다.</h3><p>전화로 받은 예약과 개인 일정도 여기에 등록하세요.</p></div>`}</section><aside class="v3-card"><h2>확인할 예약 요청</h2>${state.conversations.filter(c=>['요청 접수','시간 제안 중','고객 동의 완료'].includes(c.booking)).map(c=>`<div class="v3-list-row"><div class="grow"><strong>${esc(c.name)}</strong><p>${dateLabel(c.isoDate)} ${esc(c.time||'')}</p><p>${esc(c.sourceLabel||'홈페이지')}</p><button class="btn btn-secondary btn-small mt16" data-action="v3-open-thread" data-id="${c.id}">확인·처리</button></div>${badge(c.booking,'amber')}</div>`).join('')||'<p class="muted mt24">대기 중인 요청이 없어요.</p>'}</aside></div>`;}
function leadSuccess3(){const c=state.conversations.find(x=>x.id===state.customerThread);if(!c)return intake3();return customerShell(`<main class="v3-intake"><section class="card success-card"><div class="success-symbol">${icon('check')}</div><h1>${c.booking?'예약 요청을 보냈어요.':'문의가 접수되었어요.'}</h1><p class="muted mt16">${esc(ownerName())} 사장님이 확인합니다.<br>${c.booking?'아직 예약은 확정되지 않았습니다.':'같은 대화에서 답변을 확인할 수 있어요.'}</p><div class="receipt-box"><div class="row-between"><span class="small muted">접수번호</span><strong>${esc(c.receipt)}</strong></div><hr class="divider"><label class="small">다른 브라우저에서 사용할 접수 확인키</label><code class="v3-code mt8">${esc(c.accessKey)}</code><p class="v3-note-plain">확인키는 알림에 포함하지 않습니다. 시안의 로컬 키이며 실제 인증 기능은 아닙니다.</p></div><div class="v3-soft">접수는 브라우저에 저장되었습니다. 외부 알림은 발송되지 않습니다.</div>${goBtn('내 문의 확인하기','customer/conversation','btn-primary btn-lg wfull mt24','arrow')}</section></main>`);}

function submitIntake3(fd){const phone=String(fd.get('phone')||'').replace(/\D/g,'');if(!/^01[016789]\d{7,8}$/.test(phone)){toast('휴대전화 번호 형식을 확인해 주세요.');return;}const service=service3(fd.get('service')),booking=fd.get('booking')==='yes',iso=fd.get('date'),time=fd.get('time');if(booking&&(iso<isoToday()||iso>addDays(isoToday(),60))){toast('오늘부터 60일 이내의 날짜를 선택하세요.');return;}if(booking&&service.mode==='slot'&&(!slotTimes3(iso,service).some(x=>x.time===time&&x.free))){toast('해당 시간은 요청할 수 없어요. 다른 시간을 선택하세요.');return;}const src=b3().intakeSource,es=src?.sessionId?b3().conversations[src.sessionId]:null;if(es?.submitted){state.customerThread=es.submissionId;go('customer/success');return;}const id=uid('q'),c={id,name:fd.get('name').trim(),phone,service:service.id,preview:fd.get('message'),status:'확인 필요',type:booking?'예약 요청':'문의',when:'방금',tone:'blue',channel:src?.label||'직접 문의',mode:'paused',date:booking?Number(iso.slice(-2)):null,isoDate:booking?iso:null,time:booking?time:null,booking:booking?'요청 접수':'',requestMode:service.mode,sourceLabel:src?.label||'내 홈페이지',sourceCampaign:src?.campaignId||null,sourcePlacement:src?.placementId||null,sourceRevision:src?.revision||null,factVersion:b3().knowledgeRevision,region:fd.get('region'),priceSnapshot:service.price,durationSnapshot:service.duration,messages:[...(es?.messages||[]).map(m=>({...m,time:'문의 전'})),{by:'customer',text:fd.get('message'),time:'방금'}],photos:clone(b3().intakeDraft.photos||[]),notes:[],receipt:'FIELD-'+id.slice(-6).toUpperCase(),accessKey:'FIELD-'+uid('key').slice(4).toUpperCase()};state.conversations.unshift(c);state.customerThread=id;state.currentThread=id;state.inboxDetail=true;if(es){es.submitted=true;es.submissionId=id;}if(src)track3('inquiry_submitted',{campaignId:src.campaignId,placementId:src.placementId,submissionId:id});notify3(c.name+'님의 '+(booking?'예약 요청':'새 문의'));b3().intakeSource=null;b3().intakeDraft={...bridgeDefault().intakeDraft,service:service.id};save();go('customer/success');}

 'v3-emergency':()=>modal(b3().runtimeBlocked?'배포 제한 해제':'AI 배포 긴급 중지',`<form data-form="v3-emergency" class="v3-form-stack"><div class="v3-soft">새 AI 응답을 제한합니다. 기존 문의함·예약·고객 대화는 삭제하지 않습니다.</div>${field('조치 사유 (필수)',`<textarea name="reason" required minlength="5" placeholder="영향 범위와 사유를 적어주세요."></textarea>`)}<button class="btn ${b3().runtimeBlocked?'btn-primary':'btn-danger'}">${b3().runtimeBlocked?'제한 해제':'사유 기록 후 중지'}</button></form>`),
 'v3-admin-placement':e=>modal('해당 배포 조치',`<form data-form="v3-admin-placement" class="v3-form-stack"><input type="hidden" name="id" value="${e.dataset.id}">${field('조치',`<select class="select" name="action"><option value="suspended">이 배치 중지</option><option value="requested">제한 해제 후 재승인 대기</option></select>`)}${field('사유',`<textarea name="reason" required minlength="5"></textarea>`)}<button class="btn btn-primary">기록하고 적용</button></form>`)
});
Object.assign(forms,{
 'v3-agent-setup':fd=>{const phone=String(fd.get('phone')).replace(/\D/g,'');if(!/^01[016789]\d{7,8}$/.test(phone)){toast('연락받을 휴대전화 번호를 확인해 주세요.');return;}const s={...v2DemoSite(),name:fd.get('name').trim(),intro:fd.get('intro'),description:fd.get('intro'),industry:fd.get('industry'),region:fd.get('region'),phone,hours:fd.get('hours'),services:[{id:'s1',name:fd.get('service'),short:fd.get('service'),description:'',price:Number(fd.get('price'))||0,duration:Number(fd.get('duration')),mode:'preferred',icon:'service'}],pages:[],photo:'',headline:fd.get('name'),slug:vf().slug||'my-business'};b3().facts=s;b3().knowledgeRevision++;b3().agentName=s.name+' AI';b3().agentStatus='active';b3().entry='agent';vf().signedUp=true;vf().business=clone(s);b3().intakeDraft.service='s1';state.bookingService='s1';audit3('사업자 AI 활성화',s.name+' · 사이트 없이 시작');save();go('owner/agent');},
 'v3-knowledge':fd=>{const s=clone(b3().facts);s.intro=fd.get('intro');s.region=fd.get('region');s.hours=fd.get('hours');s.faqText=fd.get('faq');s.services.forEach((v,i)=>{v.price=Number(fd.get('price_'+i));v.mode=fd.get('mode_'+i);});syncFacts3(s);audit3('공통 사업 정보 승인','v'+b3().knowledgeRevision+' · 사이트·AI 공동 적용');render();toast('승인된 사업 정보를 반영했습니다. 기존 예약 조건은 유지됩니다.');},
 'v3-test':fd=>{b3().testInput=fd.get('question');b3().testAnswer=safeAnswer3(fd.get('question'));save();render();},
 'v3-campaign-save':()=>{save();toast('초안을 저장했습니다. 고객에게 공개되지 않았습니다.');},
 'v3-placement':fd=>{const c=campaign(fd.get('campaign')),slot=fd.get('slot');const existing=b3().placements.find(p=>p.campaignId===c.id&&p.slotId===slot&&p.revision===c.revision&&['requested','approved','suspended'].includes(p.status));if(existing){toast('이미 요청되었거나 승인된 배치입니다.');return;}b3().placements.push({id:uid('plc'),campaignId:c.id,slotId:slot,revision:c.revision,status:'requested'});audit3('매체 배치 요청',c.name+' · v'+c.revision);closeModal();render();toast('매체에 배치 승인을 요청했습니다.');},
 'v3-slot':fd=>{b3().publisher.slots.push({id:uid('slot'),name:fd.get('name'),type:fd.get('type'),active:true});audit3('노출 위치 생성',fd.get('name'),'publisher');closeModal();render();},
 'v3-publisher-settings':fd=>{const domain=String(fd.get('domain')).trim().toLowerCase();if(!/^(?:[a-z0-9-]+\.)+[a-z]{2,}$/.test(domain)){toast('올바른 도메인을 입력하세요.');return;}const changed=b3().publisher.domain!==domain;b3().publisher.name=fd.get('name');b3().publisher.domain=domain;if(changed)b3().placements.filter(p=>p.status==='approved').forEach(p=>p.status='requested');audit3('매체 정보 수정','도메인 변경 시 재승인 필요','publisher');render();},
 'v3-ad-chat':fd=>askAd3(fd.get('campaign'),fd.get('context'),fd.get('message')),
 'v3-intake':submitIntake3,
 'v3-customer-reply':fd=>{const c=state.conversations.find(c=>c.id===state.customerThread);if(!c)return;c.messages.push({by:'customer',text:fd.get('message'),time:'방금'});c.preview=fd.get('message');c.status='확인 필요';notify3('고객의 추가 답변이 도착했습니다.');save();render();},
 'v3-manual':fd=>{const date=fd.get('date'),time=fd.get('time'),duration=Number(fd.get('duration'));if(timeNum(time)+duration>1440){toast('자정을 넘지 않는 일정으로 나눠 등록해 주세요.');return;}if(conflict3(date,time,duration)){toast('기존 일정과 겹칩니다.');return;}state.manual.push({id:uid('manual'),name:fd.get('title'),isoDate:date,date:Number(date.slice(-2)),time,end:endTime(time,duration),duration,manual:true});b3().calendarDate=date;save();closeModal();render();},
 'v3-proposal':fd=>{const c=current();c.proposedISO=fd.get('date');c.proposedTime=fd.get('time');c.booking='시간 제안 중';c.status='고객 답변 대기';c.mode='paused';c.messages.push({by:'owner',text:`${dateLabel(c.proposedISO)} ${c.proposedTime}을 제안합니다. 동의 후 최종 일정을 확인하겠습니다.`,time:'방금'});notify3('새 일정 제안','customer');save();closeModal();render();},
 'v3-access':fd=>{const c=state.conversations.find(c=>c.accessKey===fd.get('key').trim());if(!c){toast('확인키가 일치하지 않습니다.');return;}state.customerThread=c.id;save();go('customer/conversation');},
 'v3-notification-settings':fd=>{vf().kakao=fd.has('kakao');vf().push=fd.has('push');if(b3().facts)b3().facts.phone=fd.get('phone');vf().business.phone=fd.get('phone');save();toast('알림 설정을 저장했습니다. 실제 발송은 하지 않습니다.');},
 'v3-service':fd=>{const s=clone(b3().facts),id=fd.get('id'),v={id:id||uid('svc'),name:fd.get('name'),short:fd.get('name'),description:fd.get('description'),price:Number(fd.get('price'))||0,duration:Number(fd.get('duration')),mode:fd.get('mode'),modeOverride:true,icon:'service'};if(id)s.services=s.services.map(x=>x.id===id?v:x);else s.services.push(v);syncFacts3(s);audit3('서비스 정보 승인',v.name);closeModal();render();},
 'v3-partner-review':fd=>{audit3('매체 검토 메모',fd.get('reason'),'admin');closeModal();toast('실제 소유권 확인이 아닌 검토 메모를 기록했습니다.');},
 'v3-emergency':fd=>{b3().runtimeBlocked=!b3().runtimeBlocked;audit3(b3().runtimeBlocked?'AI 배포 긴급 중지':'AI 배포 제한 해제',fd.get('reason'),'admin');closeModal();render();},
 'v3-admin-placement':fd=>{const p=b3().placements.find(p=>p.id===fd.get('id'));p.status=fd.get('action');audit3('배치 상태 조치',p.id+' · '+p.status+' · '+fd.get('reason'),'admin');closeModal();render();}
});
// Wrappers preserve prior interaction paths without granting new privileges.
const oldReply3=forms['owner-reply'];forms['owner-reply']=(fd,form)=>{const c=current(),note=state.replyMode==='note';oldReply3(fd,form);if(!note&&c)notify3('사업자가 답변했습니다.','customer');};
const originalPublish3=v2PublishNow;v2PublishNow=function(){const before=state.revision;originalPublish3();if(state.revision!==before){knowledgeFromSite();audit3('홈페이지·사업 정보 공개','사이트와 승인 정보 v'+b3().knowledgeRevision);render();}};actions['v2-publish']=()=>v2PublishNow();
// Entry-specific signup continuation, while retaining email/Kakao/demo buttons.
for(const k of ['v2-demo-signup','v2-kakao-signup','v2-kakao'])if(actions[k]){const fn=actions[k];actions[k]=e=>{fn(e);if(b3().entry==='agent'&&vf().signedUp)go('owner/agent-setup');};}
for(const k of ['v2-signup','login'])if(forms[k]){const fn=forms[k];forms[k]=(fd,f)=>{fn(fd,f);if(b3().entry==='agent'&&vf().signedUp)go('owner/agent-setup');};}
// Custom routing intercepts only the role review tabs. Real authorization belongs on the server.
document.addEventListener('click',e=>{const rb=e.target.closest('[data-role]');if(!rb)return;e.preventDefault();e.stopImmediatePropagation();const map={platform:'platform/home',owner:facts()?'owner/today':'owner/start',customer:vf().published?'customer/home':b3().facts?'agent/chat':'preview/demo',publisher:'publisher/overview',admin:'admin/overview'};go(map[rb.dataset.role]);},true);
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-intake]')){b3().intakeDraft[t.dataset.intake]=t.value;save();}if(t.matches('[data-creative],[data-campaign-field]')){const c=selectedCampaign();if(!c)return;if(t.dataset.campaignField)c[t.dataset.campaignField]=t.value;else c.draft[t.dataset.creative]=t.dataset.creative==='questions'?t.value.split('\n').filter(Boolean).slice(0,3):t.value;c.dirty=true;save();const p=document.getElementById('v3-campaign-preview');if(p)p.innerHTML=ad3(c.id,'preview',true);const status=document.getElementById('v3-campaign-saved');if(status)status.textContent='초안 저장됨 · 아직 미공개';}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-calendar-date]')){b3().calendarDate=t.value;save();render();}if(t.matches('[data-intake="service"],[data-intake="date"]')){b3().intakeDraft[t.dataset.intake]=t.value;save();render();}if(t.matches('[data-creative]')){const c=selectedCampaign();if(c){c.draft[t.dataset.creative]=t.value;c.dirty=true;save();const p=document.getElementById('v3-campaign-preview');if(p)p.innerHTML=ad3(c.id,'preview',true);}}if(t.matches('[data-v3-attachments]')){const fs=Array.from(t.files||[]);if(fs.length>5||fs.some(f=>f.size>10*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))){toast('JPG·PNG·WebP 최대 5장, 장당 10MB 이하로 선택하세요.');return;}Promise.all(fs.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve({name:f.name,data:cv.toDataURL('image/jpeg',.75)});};im.src=r.result;};r.readAsDataURL(f);}))).then(images=>{b3().intakeDraft.photos=images;save();render();}).catch(()=>toast('사진을 읽지 못했습니다. 다른 사진을 선택하세요.'));}});
// Bridge errors must never be silently presented as successful server storage.
save=function(){try{localStorage.setItem('field-ui-integrated-v3',JSON.stringify(state));return true;}catch(e){console.warn('Local storage unavailable',e.name);if(document.getElementById('toasts'))toast('브라우저 저장 공간이 부족하거나 제한됐습니다. 새로고침하면 변경이 사라질 수 있어요.');return false;}};
function refreshStateFromStorage3(e){if(e.key!=='field-ui-integrated-v3'||!e.newValue)return;try{const incoming=JSON.parse(e.newValue);if(incoming.bridge?.version===3){state=incoming;render();}}catch{}}
window.addEventListener('storage',refreshStateFromStorage3);
window.FieldPrototype={seedDemo:seed3,reset:()=>actions['v3-reset-confirm'](),go:go,getState:()=>clone(state),routes:directory3,version:'3.0',mode:'browser-prototype',render:()=>render()};
if(vf().published&&!b3().facts)knowledgeFromSite();
render();
// Route compatibility fixes for the retained v2 screens.
reservationModal=reservation3;
const signupDemo3=actions['v2-signup-demo'];actions['v2-signup-demo']=()=>{signupDemo3();if(b3().entry==='agent')go('owner/agent-setup');};
const signupView3=v2Signup;v2Signup=function(){let h=signupView3();if(b3().entry==='agent')h=h.replace('내 사업의 첫 화면을<br>직접 만들어보세요.','내 사업을 아는 AI를<br>직접 준비해 보세요.').replace('계정을 만들고 홈페이지 개설을 시작하세요.','계정을 만들고 사업자 AI를 준비하세요.').replace('내 홈페이지 시작하기','내 AI 시작하기');return h;};
const restore3=actions['v2-restore'];actions['v2-restore']=e=>{restore3(e);if(vf().draft&&b3().facts){const s=b3().facts;Object.assign(vf().draft,{services:clone(s.services),region:s.region,hours:s.hours,phone:s.phone,faqText:s.faqText});save();render();}};
render();
