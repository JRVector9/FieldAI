function publicServices(){return customerShell(`<div class="public-container"><header class="public-title"><div class="hero-kicker">OUR SERVICES</div><h1>공간에 맞는 케어.</h1><p>서비스별 안내를 확인하고 필요한 케어를 선택해 주세요.</p></header><div class="services-grid">${allServices().map(serviceCard).join('')}</div><div class="mt32">${notice('표시된 금액은 서비스 안내용입니다. 제품과 현장 상태에 따른 최종 금액은 사장님이 확인합니다.','neutral','info')}</div><section class="public-section"><h2>어떤 서비스가 맞을지 고민되세요?</h2><p class="muted mt8">상황을 알려주시면, 사장님이 확인할 수 있게 정리해 드려요.</p><div class="mt24">${goBtn('문의 남기기','customer/inquiry','btn-green','chat')}</div></section>${footer()}</div>`,true)}
function contactTabs(active){return `<div class="contact-tabs" role="tablist"><button class="${active==='ai'?'active':''}" data-go="customer/contact" role="tab" aria-selected="${active==='ai'}">${icon('sparkle')}AI 안내</button><button class="${active==='inquiry'?'active':''}" data-go="customer/inquiry" role="tab" aria-selected="${active==='inquiry'}">${icon('chat')}문의 남기기</button><button class="${active==='booking'?'active':''}" data-go="customer/booking" role="tab" aria-selected="${active==='booking'}">${icon('calendar')}예약 요청</button></div>`}
function contactAside(){return `<aside class="contact-aside"><div class="aside-block"><h3>온유 홈케어가 확인해요.</h3><p>직접 답변이 필요한 문의와 예약 요청은 사장님에게 전달됩니다.</p><div class="row small muted mt16">${icon('clock','i16')}평일 09:00–18:00</div></div><div class="aside-block"><h3>답변은 어떻게 받나요?</h3><p>연락처를 남기면 카카오톡으로 알려드려요. 발송이 실패하면 문자로 안내합니다.</p></div><h3>전화가 더 편하다면</h3><p>운영시간 중 전화로 문의해 주세요.</p><button class="btn-link mt8" data-action="phone">${icon('phone','i16')}전화 안내 보기</button></aside>`}
function bubble(m){let mine=m.by==='customer';let name=mine?'나':m.by==='owner'?'온유 사장님':'온유 AI 안내';return `<div class="bubble-row ${mine?'mine':''}">${mine?'':`<div class="chat-avatar">${icon(m.by==='owner'?'people':'sparkle','i16')}</div>`}<div><div class="bubble-label">${name}${m.by==='ai'?' · 데모':''}</div><div class="bubble">${esc(m.text)}</div><div class="bubble-time">${m.time||'방금'}</div></div></div>`}
function publicContact(inquiry=false){return customerShell(`<div class="contact-wrap"><header class="public-title"><h1>무엇을 도와드릴까요?</h1><p>궁금한 점을 물어보거나, 사장님에게 바로 문의를 남겨보세요.</p></header><div class="contact-layout"><section class="contact-card">${contactTabs(inquiry?'inquiry':'ai')}${inquiry?inquiryForm():`<div class="chat-log" id="public-chat"><div class="bubble-row"><div class="chat-avatar">${icon('sparkle','i16')}</div><div><div class="bubble-label">온유 AI 안내 · 데모</div><div class="bubble">안녕하세요, 온유 홈케어입니다.<br>서비스·가격·방문 지역이 궁금하신가요?<br>등록된 정보를 바탕으로 안내해 드려요.</div></div></div>${state.publicChat.map(bubble).join('')}</div><div class="quick-questions"><button data-action="ask" data-text="방문 가능한 지역은 어디인가요?">방문 가능 지역</button><button data-action="ask" data-text="세탁기 청소 가격이 궁금해요.">서비스 가격</button><button data-go="customer/inquiry">사장님에게 문의</button></div><form class="chat-composer" data-form="public-chat"><input name="message" placeholder="궁금한 점을 입력해 주세요" aria-label="AI에게 질문" required autocomplete="off"><button class="btn btn-green" aria-label="메시지 보내기">${icon('arrow')}</button></form><div class="chat-note">AI는 예약을 확정하지 않아요. 최종 일정과 금액은 사장님이 확인합니다.</div>`}</section>${contactAside()}</div></div>`)}
function inquiryForm(){return `<form data-form="inquiry" class="contact-body"><h2 style="font-size:20px">사장님에게 문의 남기기</h2><p class="small muted mt8 mb16">확인 후 답변드릴 수 있도록 필요한 내용을 알려주세요.</p><div class="form-grid">${field('이름',`<input class="input" name="name" placeholder="이름" required maxlength="30" autocomplete="off">`)}${field('휴대전화 번호',`<input class="input" name="phone" inputmode="tel" placeholder="010-0000-0000" pattern="[0-9+ -]{10,15}" required autocomplete="off">`)}<div class="form-full">${field('궁금한 서비스',`<select class="select" name="service"><option value="washer">드럼세탁기 청소</option><option value="ac">에어컨 청소</option><option value="sofa">소파·매트리스 케어</option><option value="washer">아직 잘 모르겠어요</option></select>`)}</div><div class="form-full">${field('문의 내용',`<textarea name="message" placeholder="제품 종류나 궁금한 점을 알려주세요." required maxlength="2000"></textarea>`)}</div><div class="form-full">${field('사진 첨부 <span class="muted" style="font-weight:400">선택</span>',`<label class="upload-zone">${icon('image')}<span id="upload-label">사진 추가하기 · 최대 5장</span><input type="file" accept="image/*" multiple data-upload style="display:none" aria-label="문의 사진 첨부"></label>`,'사진은 사장님 확인용이며, AI가 사진으로 진단하지 않습니다.')}</div><div class="form-full"><label class="checkline"><input type="checkbox" name="consent" required><span>문의 답변을 위한 이름·연락처·문의 내용 수집에 동의합니다. <button class="btn-link" type="button" data-action="privacy">안내 보기</button></span></label></div></div><button class="btn btn-green btn-lg wfull mt24" type="submit">문의 접수하기 ${icon('arrow')}</button><p class="field-note mt16">디자인 시안입니다. 실제 개인정보 대신 예시 정보를 입력해 주세요.</p></form>`}
function datePicker(){let cells=Array.from({length:2},()=>'<div></div>').join('');for(let n=1;n<=30;n++)cells+=`<button type="button" class="day ${state.bookingDate===n?'selected':''}" data-action="select-date" data-date="${n}" ${n<22?'disabled':''}>${n}</button>`;return `<div class="row-between"><strong style="font-size:16px">2026년 9월</strong><div class="row" style="gap:4px">${iconBtn('left','이전 달','calendar-range')}${iconBtn('chevron','다음 달','calendar-range')}</div></div><div class="calendar-select">${['월','화','수','목','금','토','일'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div>`}
function publicBooking(){const s=svc(state.bookingService);return customerShell(`<div class="contact-wrap"><header class="public-title"><h1>방문을 요청해 주세요.</h1><p>편한 시간을 알려주시면, 사장님이 확인 후 예약을 확정해요.</p></header><div class="booking-grid"><section class="card" style="overflow:hidden">${contactTabs('booking')}<div class="contact-body"><div class="steps"><span class="${state.bookingStep===1?'current':''}"><b>1</b>서비스·시간</span>${icon('chevron','i16')}<span class="${state.bookingStep===2?'current':''}"><b>2</b>연락처·확인</span></div>${state.bookingStep===1?`<div class="field mb16"><label for="booking-service">원하는 서비스</label><select class="select" id="booking-service" data-booking-service>${allServices().map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="row-between mt24 mb16"><h3 style="font-size:17px">희망 시간</h3>${badge(state.bookingMode==='slot'?'시간표 선택형':'희망시간 제출형','green')}</div><div class="pill-tabs in-card mb16" style="background:#f4f5f1;border-radius:10px;padding:4px"><button class="${state.bookingMode==='slot'?'active':''}" data-action="booking-mode" data-mode="slot">시간표에서 선택</button><button class="${state.bookingMode==='preferred'?'active':''}" data-action="booking-mode" data-mode="preferred">희망 시간 남기기</button></div><p class="field-note mb16">시안에서는 두 방식을 전환해 볼 수 있습니다. 실제 사이트에서는 사업자가 서비스별로 설정합니다.</p>${state.bookingMode==='slot'?`${datePicker()}<div class="field mt24"><label>9월 ${state.bookingDate}일, 희망 시작 시간</label><div class="times">${['09:00','10:00','11:30','13:00','14:00','15:30'].map(t=>`<button type="button" class="time ${state.bookingTime===t?'selected':''}" data-action="select-time" data-time="${t}" ${hasConflict(state.bookingDate,t,s.duration)?'disabled':''}>${t}</button>`).join('')}</div></div>`:`<div class="form-grid">${field('희망 날짜',`<input type="date" class="input" id="preferred-date" value="2026-09-${state.bookingDate}" min="2026-09-22" max="2026-11-21">`)}${field('희망 시간대',`<select class="select" id="preferred-time"><option>오전 · 09:00–12:00</option><option selected>오후 · 13:00–18:00</option><option>사장님과 조율할게요</option></select>`)}</div><p class="field-note mt16">정확한 방문 시간은 사장님과 대화로 조율합니다.</p>`}<div class="mt24">${notice('아직 예약이 확정된 것은 아니에요. 사장님이 일정과 작업 조건을 확인한 뒤 확정해 드립니다.','amber','calendar')}</div><button class="btn btn-green btn-lg wfull mt24" data-action="booking-next">다음: 연락처 입력 ${icon('arrow')}</button>`:`<form data-form="booking"><div class="form-grid">${field('이름',`<input class="input" name="name" placeholder="이름" required maxlength="30" value="${esc(state.customerName)}">`)}${field('휴대전화 번호',`<input class="input" name="phone" inputmode="tel" placeholder="010-0000-0000" pattern="[0-9+ -]{10,15}" required>`)}<div class="form-full">${field('방문 지역',`<select class="select" name="area"><option>서울 서초구</option><option>서울 강남구</option><option>다른 지역 · 방문 가능 여부 확인</option></select>`,'상세 주소는 예약 조율 시 확인합니다.')}</div><div class="form-full">${field('추가로 알려주실 내용 <span class="muted">선택</span>',`<textarea name="message" placeholder="제품 정보나 참고할 사항이 있다면 남겨주세요."></textarea>`)}</div><div class="form-full"><label class="checkline"><input type="checkbox" required><span>예약 조율을 위한 이름·연락처·요청 내용 수집에 동의합니다.</span></label></div></div><div class="mt24">${notice('요청 후에는 사장님의 확인을 기다려 주세요. 지금 결제할 금액은 없습니다.','green','info')}</div><div class="row mt24"><button type="button" class="btn btn-secondary" data-action="booking-back">이전</button><button type="submit" class="btn btn-green btn-lg grow">예약 요청 보내기 ${icon('arrow')}</button></div><p class="field-note mt16">디자인 시안입니다. 예시 정보로 제출하면 사업자 문의함에도 연결됩니다.</p></form>`}</div></section><aside class="card booking-summary"><div class="service-owner-icon">${icon(s.icon)}</div><h2 style="font-size:21px">${esc(s.name)}</h2><p class="small muted mt8">온유 홈케어 · 방문 서비스</p><hr class="divider"><div class="summary-line"><span>안내 금액</span><strong>${s.price?money(s.price)+'원부터':'상담 후 견적'}</strong></div><div class="summary-line"><span>예상 소요시간</span><strong>${s.duration}분</strong></div><div class="summary-line"><span>희망 날짜</span><strong>9월 ${state.bookingDate}일</strong></div><div class="summary-line"><span>희망 시간</span><strong>${state.bookingMode==='slot'?state.bookingTime:'선택한 시간대'}</strong></div><hr class="divider"><p class="small muted">제품과 현장 상태에 따라 시간·금액이 달라질 수 있습니다. 사장님이 최종 안내합니다.</p><div class="mt16">${badge('사장님 확인 후 확정','amber')}</div></aside></div></div>`)}
function publicSuccess(){let c=state.conversations.find(x=>x.id===state.customerThread);let isBooking=c?.type==='예약 요청';return customerShell(`<div class="contact-wrap"><section class="card success-card"><div class="success-symbol">${icon('check')}</div><h1>${isBooking?'예약 요청을 보냈어요.':'문의가 접수되었어요.'}</h1><p class="muted mt16">사장님이 내용을 확인하고 답변드릴게요.<br>${isBooking?'아직 예약이 확정된 상태는 아닙니다.':'답변이 도착하면 카카오톡으로 알려드려요.'}</p><div class="receipt-box"><div class="row-between small"><span class="muted">접수번호</span><strong>ONY-0922-${c?.id.slice(-3)||'108'}</strong></div><hr class="divider"><div class="small fw">다른 브라우저에서 사용할 접수 확인키</div><div class="receipt-key"><code>DEMO-ONYU-${c?.id.slice(-4)||'108A'}</code><button class="iconbtn" data-action="copy-key" aria-label="접수 확인키 복사">${icon('copy')}</button></div><p class="field-note mt8">이 키는 다른 사람에게 공유하지 마세요. 같은 브라우저에서는 다시 입력하지 않아도 됩니다.</p></div>${notice('접수 내용은 저장되었습니다. 이 시안에서는 실제 알림을 발송하지 않습니다.','neutral','info')}<button class="btn btn-green btn-lg wfull mt24" data-go="customer/conversation">내 문의 확인하기 ${icon('arrow')}</button><button class="btn-link mt16" data-go="customer/home">사이트로 돌아가기</button></section></div>`)}
function publicConversation(){const c=state.conversations.find(x=>x.id===state.customerThread)||state.conversations[0];const s=svc(c.service);return customerShell(`<div class="contact-wrap"><div class="row-between mb16"><button class="btn-link" data-go="customer/home">${icon('left','i16')}사이트로</button>${badge('내 접수 대화','green')}</div><section class="contact-card conversation-card"><div class="conversation-title"><div class="row-between"><div><h2>온유 홈케어와의 대화</h2><p class="small muted mt8">${esc(s.name)} · 접수 ${c.id==='q1'?'ONY-0922-108':esc(c.id.slice(-6))}</p></div>${badge(c.booking||c.status,c.booking==='확정'?'green':'amber')}</div></div>${c.booking?`<div class="appointment-inline"><div class="row-between"><div><h3>9월 ${c.date}일 · ${c.time}</h3><p>${c.booking==='확정'?'사장님이 예약을 확정했습니다.':'사장님 확인 후 예약이 확정됩니다.'}</p></div>${icon('calendar')}</div>${c.booking==='시간 제안 중'?`<div class="mt16"><p class="small fw">제안받은 시간: 9월 ${c.proposedDate}일 ${c.proposedTime}</p><div class="row mt16">${btn('이 시간에 동의','accept-time','btn-green btn-small')}${btn('다른 시간 요청','request-change','btn-secondary btn-small')}</div></div>`:''}${c.booking==='확정'?`<div class="row mt16">${btn('변경 요청','request-change','btn-secondary btn-small')}${btn('취소 요청','request-cancel','btn-secondary btn-small')}</div>`:''}</div>`:''}<div class="chat-log">${c.messages.map(bubble).join('')}</div><form class="chat-composer" data-form="customer-reply"><input name="message" placeholder="추가로 전달할 내용을 입력해 주세요" required aria-label="사장님에게 추가 메시지"><button class="btn btn-green" aria-label="추가 메시지 보내기">${icon('arrow')}</button></form><div class="chat-note">이 대화는 접수한 고객과 사장님만 확인할 수 있습니다. (데모)</div></section></div>`)}
function publicAccess(){return customerShell(`<div class="contact-wrap"><section class="card success-card"><div class="success-symbol">${icon('lock')}</div><h1>내 문의를 확인할게요.</h1><p class="muted mt16">접수할 때 보관한 확인키를 입력해 주세요.<br>전화번호만으로는 대화를 조회할 수 없습니다.</p><form data-form="access" class="mt24" style="text-align:left">${field('접수 확인키',`<input class="input" name="key" placeholder="DEMO-ONYU-108A" required>`)}<button class="btn btn-green btn-lg wfull mt24">대화 확인하기</button></form><p class="field-note mt16">시안 테스트 키: DEMO-ONYU-108A</p><button class="btn-link mt16" data-action="report">신청한 적이 없나요? 오발송 신고</button></section></div>`)}
function publicAbout(faq=false){const qs=[['어느 지역으로 방문하나요?','서울 강남구와 서초구에 방문합니다. 다른 지역은 문의를 남겨 방문 가능 여부를 확인해 주세요.'],['시간을 선택하면 바로 예약되나요?','아니요. 희망 시간을 요청하면 사장님이 작업 조건과 일정을 확인하고 확정합니다.'],['예약할 때 결제가 필요한가요?','이 사이트에서는 서비스 대금을 받지 않습니다. 최종 금액과 결제 방법은 사장님이 직접 안내합니다.'],['AI가 답변하지 못하면 어떻게 하나요?','사장님에게 문의를 남길 수 있습니다. 답변이 오면 카카오톡으로 알려드리고, 발송 실패 시 문자로 대체합니다.']];return customerShell(`<div class="public-about"><div class="hero-kicker">${faq?'QUESTIONS & ANSWERS':'ABOUT ONYU'}</div><h1>${faq?'궁금한 점을\n확인해 보세요.'.replace('\n','<br>'):'좋은 하루는,<br>편안한 공간에서.'}</h1>${faq?'':`<p>온유 홈케어는 가전과 생활 공간을 돌보는 1인 방문 케어 서비스입니다. 문의부터 방문 일정까지, 사장님이 직접 확인하고 이야기합니다.</p><p>필요한 서비스만 안내하고, 정해진 시간에 꼼꼼하게. 고객의 일상에 조용하고 산뜻한 변화를 더하고 싶습니다.</p><div class="mt32">${notice('사업 소개 예시입니다. 실제 공개 전에는 사업자가 자신의 정보를 직접 확인합니다.','neutral')}</div>`}<div class="mt32">${qs.map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><div class="mt32">${goBtn('다른 질문 남기기','customer/inquiry','btn-green','chat')}</div></div>`)}

ata-go="owner/notifications">발송 내역 확인 ${icon('chevron','i16')}</button></div></div></div>`:''}<div class="mt24 small muted row">${icon('sparkle','i16')}AI가 해결한 일반 질문은 알림 없이 기록돼요.</div></section><aside class="dashboard-side stack"><div class="card card-pad"><div class="section-head"><h2>오늘의 일정</h2><button class="btn-link" data-go="owner/calendar">전체 ${icon('chevron','i16')}</button></div><div class="timeline">${todays.map(b=>`<div class="timeline-row" data-action="booking-detail" data-id="${b.id}" role="button" tabindex="0"><div class="timeline-time">${b.time}</div><div class="timeline-content"><strong>${svc(b.service).short}</strong><p>${b.name} · ${b.area}</p><p>${b.time}–${b.end}</p></div></div>`).join('')}<div class="timeline-row"><div class="timeline-time">16:00</div><div class="timeline-content" style="border-color:#e3e3e9"><strong>개인 일정</strong><p>16:00–17:00 · 시간 차단</p></div></div></div><button class="btn btn-secondary wfull mt16" data-action="manual-booking">${icon('plus','i16')}일정 직접 추가</button></div><div class="card card-pad"><div class="site-mini"><div class="site-mini-art">o.</div><div class="grow"><h3 style="font-size:17px">내 사이트</h3><p class="small muted mt8">onyu.field.example</p></div>${badge('공개 중','green')}</div><div class="activity-footer"><span>마지막 수정 · 오늘 08:40</span><button class="btn-link" data-go="owner/builder">수정하기 ${icon('chevron','i16')}</button></div></div></aside></div>`}
function inboxItems(){const search=state.inboxSearch.trim().toLowerCase();let list=state.conversations.filter(c=>(state.inboxFilter==='all'||state.inboxFilter==='needed'&&c.status==='확인 필요'||state.inboxFilter==='ai'&&c.type==='AI 안내')&&(!search||[c.name,c.preview,svc(c.service).name].join(' ').toLowerCase().includes(search)));return list.length?list.map(c=>`<button class="inbox-item ${c.id===state.currentThread?'selected':''}" data-action="select-thread" data-id="${c.id}"><div class="inbox-item-title"><strong>${esc(c.name)}</strong><span class="small">${c.when}</span></div><p class="ellipsis">${esc(c.preview)}</p><div class="row-between">${badge(c.status,c.status==='확인 필요'?'blue':c.status==='처리 완료'?'gray':'green')}<span class="small">${c.type==='AI 안내'?'AI':c.type==='예약 요청'?'예약':''}</span></div></button>`).join(''):'<div class="empty"><p>검색 결과가 없습니다.</p></div>'}

내지 않았어요.':'고객이 확인받고 싶은 내용에 직접 답변해 주세요.'}</p>`}</div><div class="thread-mode">${icon(c.mode==='paused'?'pause':'sparkle','i16')}${c.mode==='paused'?'직접 응대 중 · AI 자동 답변이 일시 중지됐어요.':'답변을 보내면 AI 자동 응대가 중지돼요.'}</div><div class="chat-log">${c.messages.map(ownerBubble).join('')}${(c.notes||[]).map(n=>`<div class="internal-note">${icon('lock','i16')} 내부 메모 · ${esc(n)}</div>`).join('')}</div><div class="thread-tools"><div class="pill-tabs in-card"><button class="${state.replyMode==='reply'?'active':''}" data-action="reply-mode" data-mode="reply">고객에게 답변</button><button class="${state.replyMode==='note'?'active':''}" data-action="reply-mode" data-mode="note">내부 메모</button></div><button class="btn-link" style="margin-left:auto" data-action="ai-draft">${icon('sparkle','i16')}초안</button></div><form class="thread-editor" data-form="owner-reply"><textarea name="message" id="owner-reply" placeholder="${state.replyMode==='note'?'사장님만 보는 메모를 남겨주세요.':'고객에게 전달할 답변을 작성해 주세요.'}" required aria-label="${state.replyMode==='note'?'내부 메모':'고객에게 답변'}"></textarea><div class="thread-editor-actions"><span class="small muted">${state.replyMode==='note'?'고객에게 전송되지 않습니다.':'답변 알림: 카카오톡 → 실패 시 문자'}</span><button class="btn ${state.replyMode==='note'?'btn-secondary':'btn-primary'} btn-small">${state.replyMode==='note'?'메모 저장':'보내기'} ${icon('arrow','i16')}</button></div></form></section></div>`}

rvice).short)} · ${esc(e.name)}</strong><p>${e.time}–${e.end}</p></div></div></div>`).join('')}</div></section><aside class="card card-pad"><div class="section-head"><h2>확인할 요청</h2>${badge(reqs.length+'건','amber')}</div><div class="booking-requests">${reqs.length?reqs.map(c=>`<div class="request-mini">${badge(c.booking,'amber')}<h3>${esc(c.name)} · ${esc(svc(c.service).short)}</h3><p>9월 ${c.date}일 ${c.time}${c.id==='q3'?' 이후':''}<br>${c.requestMode==='preferred'?'희망시간 제출형':'시간표 선택형'}</p>${btn('요청 확인','review-reservation','btn-secondary btn-small','',`data-id="${c.id}"`)}</div>`).join(''):'<p class="small muted">새 예약 요청이 없어요.</p>'}</div><div class="mt24">${notice('미확정 요청은 시간을 점유하지 않아요. 확정할 때 겹치는 일정을 다시 확인합니다.','neutral','info')}</div></aside></div>`}
function ownerBuilder(){return `${heading('내 사이트','초안은 자동 저장돼요. 공개한 내용만 고객에게 보여요.',`<div class="row">${btn('미리보기','preview-site','btn-secondary','eye')}${btn('변경 내용 공개','publish-review','btn-primary','upload')}</div>`)}<div class="builder-layout"><aside class="card builder-panel"><div class="builder-panel-title">페이지 <button class="iconbtn" data-action="add-page" aria-label="페이지 추가">${icon('plus','i16')}</button></div><div class="builder-pages">${['홈','서비스','온유 소개','자주 묻는 질문'].map(p=>`<button class="builder-page ${state.sitePage===p?'active':''}" data-action="builder-page" data-page="${p}">${icon(p==='홈'?'home':'document','i16')}${p}</button>`).join('')}</div><div class="builder-sections"><div class="small fw muted" style="padding:10px 0">섹션 구성</div>${['사이트 헤더','대표 소개','서비스 목록','이용 안내','하단 정보'].map((p,i)=>`<div class="builder-section"><span class="row" style="gap:9px">${icon('menu','i16')}${p}</span><button class="iconbtn" style="height:30px;width:30px" data-action="edit-section" data-section="${p}" aria-label="${p} 수정">${icon('edit','i16')}</button></div>`).join('')}</div><div class="theme-swatches" aria-label="사이트 포인트 색상">${[['green','#486a4c','세이지 그린'],['blue','#486c97','차분한 블루'],['navy','#2e3543','네이비'],['sand','#a28d70','웜 샌드']].map(([id,color,name])=>`<button class="swatch ${state.draftColor===id?'active':''}" style="background:${color}" data-action="theme-color" data-color="${id}" aria-label="${name}" title="${name}"></button>`).join('')}</div></aside><section><div class="builder-canvas"><div class="canvas-address">${icon('lock','i16')}onyu.field.example ${badge('미공개 초안','gray')}</div><div class="canvas-content"><div class="canvas-header"><strong>온유 홈케어</strong><span>서비스　 소개</span><button class="btn btn-green btn-small" data-action="preview-site">문의하기</button></div>${state.sitePage==='홈'?`<div class="canvas-hero" style="${state.draftColor==='blue'?'background:#ecf1f8':state.draftColor==='navy'?'background:#edf0f3':state.draftColor==='sand'?'background:#f5f1e9' async function copyText(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'복사했습니다.')}catch{modal('복사할 내용',`<input class="input" readonly value="${esc(text)}" onclick="this.select()"><p class="field-note mt16">내용을 선택해 복사해 주세요.</p>`)}}
function endTime(t,d){const [h,m]=t.split(':').map(Number),n=h*60+m+d;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timeNum(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function hasConflict(date,time,duration){let a=timeNum(time),b=a+duration;return state.bookings.some(e=>e.date===date&&a<timeNum(e.end)&&b>timeNum(e.time))||(date===22&&a<17*60&&b>16*60)||state.manual.some(e=>e.date===date&&a<timeNum(e.time)+60&&b>timeNum(e.time))}

function createRequest(fd,isBooking){const name=fd.get('name'),raw=String(fd.get('phone')||'').replace(/\D/g,'');if(raw.length<10||raw.length>11){toast('휴대전화 번호 형식을 확인해 주세요.');return}const sid=isBooking?state.bookingService:fd.get('service'),id='q'+Date.now();const c={id,name,phone:raw.slice(0,3)+'-****-'+raw.slice(-4),service:sid,preview:isBooking?'새 예약 요청이 도착했어요.':fd.get('message'),status:'확인 필요',type:isBooking?'예약 요청':'문의',when:'방금',tone:'blue',channel:isBooking?'사이트 예약':'직접 문의',mode:'paused',date:state.bookingDate,time:state.bookingTime,requestMode:state.bookingMode,booking:isBooking?'요청 접수':'',area:fd.get('area')||'',messages:[{by:'customer',text:isBooking?`${svc(sid).name} 예약을 요청합니다. 9월 ${state.bookingDate}일 ${state.bookingTime}${state.bookingMode==='preferred'?' 전후 희망 시간대':''}. ${fd.get('message')||''}`:fd.get('message'),time:'방금'}]};state.conversations.unshift(c);state.customerThread=id;state.currentThread=id;state.customerName=name;state.bookingStep=1;save();go('customer/success')}

const v2Industries=['출장·홈케어','출장 세차','레슨·교육','사진·촬영','미용·뷰티','상담·컨설팅','기타 서비스'];
function v2DefaultFlow(){return {version:2,signedUp:false,email:'',ownerName:'',method:'template',template:'essential',prompt:'',step:'business',panel:'content',editorTab:'preview',device:'desktop',page:'home',business:{name:'',industry:'출장·홈케어',region:'',intro:'',phone:'',hours:'평일 09:00–18:00',photo:'',services:[{id:'s1',name:'',description:'',price:0,duration:60,icon:'service',mode:'preferred'}]},draft:null,published:null,versions:[],slug:'',bookingMode:'preferred',kakao:true,push:true,pushTest:false,phoneButton:true,inquiry:true,booking:true,consent:false,generated:false,source:'new',lastSaved:''};}
if(!state.flow){state.flow=v2DefaultFlow();state.conversations=[];state.bookings=[];state.manual=[];state.currentThread=null;state.customerThread=null;state.publicChat=[];state.customServices=[];state.revision=0;state.domain='';state.domainStatus='none';save();}
const vf=()=>state.flow;
const v2Name=()=>vf().draft?.name||vf().business.name||'내 사업';
const v2Published=()=>vf().published;
function v2Persist(){vf().lastSaved=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});save();}
function v2IconForIndustry(i){return /촬영/.test(i)?'image':/레슨/.test(i)?'document':/뷰티/.test(i)?'leaf':/세차/.test(i)?'sparkle':/상담/.test(i)?'chat':'service';}
function v2NormalizeServices(a){return a.filter(x=>x.name.trim()).map((s,i)=>({...s,id:s.id||'s'+(i+1),short:s.name,price:Number(s.price)||0,duration:Number(s.duration)||60,icon:s.icon||v2IconForIndustry(vf().business.industry),tone:'blue',mode:s.modeOverride?s.mode:vf().bookingMode}));}
function v2MakeDraft(){const f=vf(),b=f.business,l=v2Layouts.find(t=>t.id===f.template)||v2Layouts[0];f.draft={...structuredClone(b),services:v2NormalizeServices(b.services),headline:b.name+'와 함께,\n조금 더 편안하게.',description:b.intro,layout:l.id,accent:l.color,soft:l.soft,pages:['home','services','about'],sections:['hero','services','about','faq'],largePhoto:false,bookingMode:f.bookingMode,phoneButton:f.phoneButton,slug:f.slug||'my-business'};if(/세차/.test(b.industry))f.draft.headline='깨끗한 차,\n편안한 일상.';if(/촬영/.test(b.industry))f.draft.headline='지금의 당신을,\n오래 기억하도록.';if(/레슨/.test(b.industry))f.draft.headline='좋아하는 일을,\n나만의 속도로.';f.generated=true;f.page='home';f.panel='content';f.editorTab='preview';v2Persist();}
function v2BuildAvailable(){return !!(vf().business.name.trim()&&vf().business.intro.trim()&&vf().business.services.some(s=>s.name.trim()));}
function v2Nav(){return `<nav class="v2-nav v2-wrap"><button class="v2-wordmark" data-go="platform/home" aria-label="field 플랫폼 홈">${brand()}</button><div class="v2-nav-links"><button data-action="v2-scroll" data-target="platform-features">주요 기능</button><button data-action="v2-scroll" data-target="platform-templates">템플릿</button><button data-action="v2-how">만드는 방법</button></div><div class="v2-nav-right"><button class="btn-link" data-go="${vf().signedUp?'owner/start':'platform/signup'}">${vf().signedUp?'내 관리실':'로그인'}</button><button class="btn btn-dark" data-action="v2-start">내 홈페이지 만들기</button></div></nav>`;}
function v2Thumb(id,name='내 브랜드'){const l=v2Layouts.find(t=>t.id===id)||v2Layouts[0];return `<div class="v2-thumb ${id}"><div class="v2-thumb-paper"><div class="v2-thumb-top"><span>${esc(name)}</span><i></i></div><div class="v2-thumb-core"><div><h3>${id==='editorial'?'당신만의 시선.':id==='warm'?'일상에, 여유를.':'좋은 시작을 함께.'}</h3><p>${id==='editorial'?'기억하고 싶은 순간':id==='warm'?'나를 위한 작은 시간':'필요한 서비스를 편하게'}</p></div><div class="v2-thumb-picture">${icon(l.icon)}</div></div></div></div>`;}
function v2TemplateCards(context='design'){return `<div class="v2-templates">${v2Layouts.map(l=>`<button class="v2-template ${context==='design'&&vf().template===l.id?'selected':''}" data-action="${context==='platform'?'v2-start-template':'v2-select-template'}" data-id="${l.id}" aria-pressed="${vf().template===l.id}">${v2Thumb(l.id,context==='platform'?({essential:'클린드라이브',editorial:'스튜디오 여백',warm:'모아 피아노'})[l.id]:vf().business.name||'내 브랜드')}<div class="v2-template-label"><div><strong>${l.name}</strong><span>${l.desc}</span></div>${icon(context==='design'&&vf().template===l.id?'checkcircle':'arrow')}</div></button>`).join('')}</div>`;}
function v2PlatformHome(){return `<div class="v2-scroll" id="platform-scroll">${v2Nav()}<main class="v2-wrap"><section class="v2-hero"><div><div class="v2-eyebrow">${icon('sparkle','i16')}혼자 시작해도, 운영은 함께.</div><h1>내 사업 홈페이지.<br><span>만들고, 연결하고.</span></h1><p class="v2-intro">사업을 소개하면 홈페이지가 시작됩니다.<br>AI가 문의를 받고, 사장님은 필요한 순간에 답하세요.</p><div class="v2-hero-actions"><button class="btn btn-primary btn-lg" data-action="v2-start">내 홈페이지 만들기 ${icon('arrow')}</button><button class="btn btn-secondary btn-lg" data-action="v2-demo">완성 예시 보기</button></div><div class="v2-proof">${icon('checkcircle','i16')}직접 제작·운영 · 14일 체험 제안 · 카드 없이 시작</div></div><div class="v2-hero-visual"><div class="v2-browser"><div class="v2-browser-bar"><span class="v2-browser-dots"><i></i><i></i><i></i></span><span>cleandrive.field.example</span>${icon('lock','i16')}</div><div class="v2-mock-site"><div class="v2-mock-head"><strong>클린드라이브</strong><span>서비스　문의</span></div><div class="v2-mock-content"><div><h2>깨끗한 차,<br>편안한 일상.</h2><p>분당·판교 출장 세차.<br>원하는 곳에서 편하게.</p><button class="btn btn-dark btn-small" data-action="v2-demo">예약 요청 ${icon('arrow','i16')}</button></div><div class="v2-site-symbol">${icon('sparkle')}</div></div><div class="v2-mock-services"><div>${icon('service','i16')}외부 세차</div><div>${icon('calendar','i16')}원하는 날짜 요청</div></div></div></div><div class="v2-floating-note"><div class="avatar blue">${icon('chat')}</div><div class="grow"><strong>새로운 예약 요청이 도착했어요.</strong><span class="muted">AI가 정보를 확인하고, 사장님에게 연결합니다.</span></div>${icon('checkcircle')}</div></div></section><section class="v2-feature-strip" id="platform-features"><div>${icon('globe')}<div><strong>내 이름으로 만든 사이트</strong>사업 정보와 사진으로 직접 제작</div></div><div>${icon('chat')}<div><strong>문의가 이어지는 접수창구</strong>AI 안내·직접 문의·예약 요청</div></div><div>${icon('calendar')}<div><strong>내 손안의 운영실</strong>휴대전화에서 답변하고 일정 확인</div></div></section><section class="v2-section" id="platform-templates"><div class="v2-section-title"><div><h2>시작은 가볍게. 모습은 나답게.</h2><p>템플릿을 선택하거나 AI에게 설명하고, 원하는 대로 다듬으세요.</p></div><button class="btn-link" data-action="v2-start">내 사이트로 시작 ${icon('arrow','i16')}</button></div>${v2TemplateCards('platform')}</section><footer class="v2-platform-footer"><div>${brand()}<span class="mt8">내 사이트부터 고객과의 첫 연결까지.</span></div><div><span>field는 플랫폼 가칭입니다.</span><span>UI 시안 · 실제 가입·AI·알림·외부 공개는 연결하지 않았습니다.</span></div></footer></main></div>`;}
function v2Signup(){return `<div class="v2-scroll">${v2Nav()}<main class="v2-auth"><section class="v2-auth-story"><div class="v2-eyebrow">YOUR BUSINESS, YOUR SPACE</div><h1>내 사업의 첫 화면을<br>직접 만들어보세요.</h1><p>개발 지식 없이도 괜찮아요.<br>사업 정보만 준비하면 시작할 수 있어요.</p><div class="v2-auth-list"><div>${icon('globe')}나만의 사이트와 주소</div><div>${icon('sparkle')}AI와 함께 만드는 소개</div><div>${icon('chat')}고객 문의·예약을 한곳에서</div></div></section><section class="v2-auth-form"><h2>내 사업의 새로운 시작.</h2><p>계정을 만들고 홈페이지 개설을 시작하세요.</p><button class="btn kakao btn-lg wfull" data-action="v2-kakao">${icon('chat')}카카오로 시작하기</button><div class="separator">또는 이메일로</div><form data-form="v2-signup">${field('이름',`<input class="input" name="name" autocomplete="given-name" placeholder="어떻게 불러드릴까요?" maxlength="30" required>`)}<div class="mt16">${field('이메일',`<input class="input" type="email" name="email" autocomplete="email" placeholder="name@example.com" required>`)}</div><label class="checkline mt24"><input type="checkbox" required>서비스 이용약관과 개인정보 처리 안내에 동의합니다. <span class="muted">시안</span></label><button class="btn btn-primary btn-lg wfull mt24">내 홈페이지 시작하기 ${icon('arrow')}</button></form><p class="field-note mt20" style="margin-top:18px">실제 계정이 생성되거나 이메일이 발송되지 않습니다.<br>입력 내용은 이 브라우저의 시안에만 저장됩니다.</p><button class="btn-link mt16" data-action="v2-signup-demo">예시 계정으로 둘러보기 ${icon('arrow','i16')}</button></section></main></div>`;}
function v2OwnerStart(){const f=vf(),hasDraft=!!f.draft;return `<div class="v2-scroll">${v2Nav()}<main class="v2-start"><div class="v2-eyebrow">${icon('home','i16')}사업자 관리실 · ${f.signedUp?'새로운 시작':'가입 전 미리보기'}</div><h1>${esc(f.ownerName||'사장님')}${f.ownerName?'님,':' ,'} 반가워요.<br>${hasDraft?'만들던 홈페이지를 이어갈까요?':'이제 내 홈페이지를 만들어요.'}</h1><p class="v2-start-intro">고객이 찾아와 서비스를 보고, 문의하고, 예약을 요청할 수 있는<br class="hide-mobile"> 나만의 공간을 직접 만들어보세요.</p><section class="v2-start-card"><div><h2>${hasDraft?esc(f.draft.name)+'의 미공개 초안':'아직 공개된 사이트가 없어요.'}</h2><p>${hasDraft?'작성한 내용은 이 브라우저에 저장되어 있어요. 고객에게는 공개 전까지 보이지 않습니다.':'사이트를 먼저 만들면 문의함과 예약 관리도 함께 준비됩니다.'}</p><div class="v2-start-path"><span>사업 정보</span>${icon('chevron','i16')}<span>디자인·편집</span>${icon('chevron','i16')}<span>공개</span></div><button class="btn btn-primary btn-lg mt24" data-action="v2-resume">${hasDraft?'이어서 만들기':'내 홈페이지 만들기'} ${icon('arrow')}</button></div><div class="v2-start-graphic"><div></div><div>${icon('plus','i28')}</div><div></div></div></section><div class="v2-start-note">${icon('info','i16')}<span>사이트가 공개되기 전에는 예시 고객이나 예약을 표시하지 않아요.<br>나중에 실제 문의가 들어오면 이곳에서 확인할 수 있습니다.</span></div>${f.published?`<button class="btn-link mt24" data-go="owner/today">공개된 사이트 관리실로 이동 ${icon('arrow','i16')}</button>`:''}</main></div>`;}
function v2WizardHeader(){return `<header class="v2-creation-head"><div class="v2-head-title"><button class="v2-wordmark" data-go="platform/home">${brand()}</button><span>${vf().published?'내 사이트 편집':'내 홈페이지 만들기'}</span></div><div class="row"><span class="v2-save">${icon('checkcircle','i16')}${vf().lastSaved?(v2StorageAvailable?'이 브라우저에 저장됨':'현재 세션에 저장됨'):'초안 자동 저장'}</span><button class="btn-link" data-go="${vf().published?'owner/today':'owner/start'}">나가기 ${icon('close','i16')}</button></div></header>`;}
function v2StepBar(current){const index=v2Steps.findIndex(s=>s[0]===current);return `<aside class="v2-stepbar"><p>내 사이트의 시작</p>${v2Steps.map(([id,label],i)=>`<button class="v2-step ${current===id?'active':i<index?'complete':''}" data-action="v2-step" data-step="${id}" ${i>index&&!vf().draft?'disabled':''}><b>${i<index?icon('check','i16'):i+1}</b><span>${label}</span></button>`).join('')}<p class="v2-stepbar-note">${icon('shield')}만드는 중인 내용은<br>고객에게 보이지 않아요.<br>공개는 직접 확인한 뒤.</p></aside>`;}
function v2StepTitle(step,title,desc){const n=v2Steps.findIndex(s=>s[0]===step)+1;return `<header class="v2-stage-title"><div class="v2-eyebrow">STEP ${String(n).padStart(2,'0')} / 05</div><h1>${title}</h1><p>${desc}</p></header>`;}
function v2WizardFrame(step,content,next='다음',nextAction='v2-next',footNote='작성 중인 내용은 자동 저장돼요.'){const idx=v2Steps.findIndex(s=>s[0]===step);return `<div class="v2-wizard">${v2WizardHeader()}<div class="v2-wizard-body">${v2StepBar(step)}<section class="v2-stage"><div class="v2-stage-scroll"><div class="v2-stage-content">${content}</div></div><footer class="v2-stepfoot"><span class="small">${footNote}</span><div class="row"><button class="btn btn-secondary" data-action="v2-prev" data-step="${step}">${icon('left','i16')}이전</button><button class="btn btn-primary" data-action="${nextAction}" data-step="${step}">${next} ${icon(idx===4?'upload':'arrow','i16')}</button></div></footer></section></div></div>`;}
function v2BusinessForm(){const b=vf().business;return v2WizardFrame('business',`${v2StepTitle('business','어떤 일을 하고 계신가요?','여기에 적은 내용이 내 홈페이지와 AI 안내의 기초가 됩니다.')}<form id="v2-business-form" data-form="v2-business"><section class="v2-form-block"><h2>사업을 소개해 주세요.</h2><div class="form-grid">${field('상호명',`<input class="input" data-business="name" name="businessName" maxlength="40" placeholder="예: 클린드라이브" value="${esc(b.name)}" required>`)}${field('업종',`<select class="select" data-business="industry">${v2Industries.map(x=>`<option ${b.industry===x?'selected':''}>${x}</option>`).join('')}</select>`)}<div class="form-full">${field('활동 지역 또는 서비스 방식',`<input class="input" data-business="region" maxlength="80" placeholder="예: 성남 분당·판교 / 온라인 / 매장 방문" value="${esc(b.region)}" required>`)}</div><div class="form-full">${field('내 사업 한 줄 소개',`<textarea data-business="intro" maxlength="350" placeholder="어떤 서비스를 누구에게 제공하는지 알려주세요." required>${esc(b.intro)}</textarea>`)}</div></div><div class="v2-example-row"><span>입력 예시로 시작</span>${[['car','출장 세차'],['photo','사진 스튜디오'],['lesson','피아노 레슨']].map(([id,t])=>`<button type="button" data-action="v2-example" data-id="${id}">${t}</button>`).join('')}</div></section><section class="v2-form-block"><div class="row-between mb16"><h2 style="margin:0">제공하는 서비스</h2><button type="button" class="btn-link" data-action="v2-service-add">${icon('plus','i16')}추가</button></div><p class="field-note mb16">우선 대표 서비스부터 등록하세요. 가격이 미정이면 비워두세요.</p>${b.services.map((s,i)=>`<div class="v2-service-input">${field('서비스 이름',`<input class="input" data-service-index="${i}" data-service-field="name" value="${esc(s.name)}" maxlength="50" placeholder="예: 외부 세차" required>`)}${field('시작 가격 · 원',`<input class="input" type="number" min="0" max="99999999" data-service-index="${i}" data-service-field="price" value="${s.price||''}" placeholder="상담 후 견적">`)}${field('시간 · 분',`<input class="input" type="number" min="15" max="720" step="15" data-service-index="${i}" data-service-field="duration" value="${s.duration||60}">`)}<button class="iconbtn" type="button" data-action="v2-service-remove" data-index="${i}" ${b.services.length===1?'disabled':''} aria-label="서비스 ${i+1} 삭제">${icon('close','i16')}</button></div>`).join('')}</section><section class="v2-form-block"><h2>대표 사진 <span class="small muted">선택</span></h2><label class="v2-photo-upload">${b.photo?`<img src="${b.photo}" alt="선택한 대표 사진">`:icon('image')}<div><strong>${b.photo?'사진이 선택됐어요.':'내 작업이나 공간을 보여주세요.'}</strong><span>JPG·PNG·WebP / 이 브라우저에서만 사용<br>사진 없이 시작하고 나중에 추가할 수 있어요.</span></div><input type="file" accept="image/jpeg,image/png,image/webp" data-v2-photo="business" aria-label="대표 사진 선택"></label></section><button type="submit" class="hide">다음</button></form>`,'디자인 선택');}
function v2Design(){const f=vf();return v2WizardFrame('design',`${v2StepTitle('design','어떤 모습으로 시작할까요?','어느 방식이든 내 사업 정보를 반영하고, 직접 수정할 수 있어요.')}<div class="v2-select-method"><button class="${f.method==='template'?'active':''}" data-action="v2-method" data-method="template">${icon('grid','i16')}템플릿으로 시작</button><button class="${f.method==='ai'?'active':''}" data-action="v2-method" data-method="ai">${icon('sparkle','i16')}AI에게 설명하기</button></div>${f.method==='ai'?`<div class="v2-ai-prompt"><h2>원하는 분위기를 알려주세요.</h2><p>사실 정보는 앞에서 입력한 내용을 사용해요. 색감과 화면 구성을 설명해 주세요.</p><textarea data-flow="prompt" placeholder="예: 흰색 배경에 네이비 포인트를 쓰고 싶어요. 대표 사진은 크게, 서비스 목록은 위쪽에 보여주세요.">${esc(f.prompt)}</textarea><div class="prompt-chips mt16">${['심플한 네이비, 서비스 중심','큰 사진, 잡지처럼 여유롭게','따뜻한 베이지, 부드러운 분위기'].map(t=>`<button data-action="v2-prompt" data-prompt="${t}">${t}</button>`).join('')}</div><p class="field-note mt16" style="margin-bottom:0">시안에서는 설명의 키워드로 구성요소를 조합합니다. 실제 AI는 연결하지 않았어요.</p></div>`:''}${v2TemplateCards()}<div class="v2-selection-summary">${icon('checkcircle')}<span><strong>${esc(f.business.name||'내 사업')}</strong>의 소개와 서비스 ${f.business.services.filter(s=>s.name.trim()).length}개가 선택한 디자인에 반영됩니다. 템플릿의 예시 상호는 그대로 남지 않아요.</span></div><div id="v2-generation"></div>`,'내 사이트 초안 만들기','v2-generate','디자인은 만들고 나서도 바꿀 수 있어요.');}
function v2SiteHeader(s,preview=false){return `<div class="v2-site-container"><header class="v2-site-header"><button class="v2-site-brand" ${preview?'data-action="v2-preview-page" data-page="home"':'data-go="customer/home"'}><span class="v2-site-mark">${esc(s.name.slice(0,1))}</span><span>${esc(s.name)}</span></button><nav class="v2-site-links">${s.pages.filter(x=>x!=='home').map(p=>`<button ${preview?`data-action="v2-preview-page" data-page="${p}"`:`data-go="customer/${p}"`} class="${(preview?vf().page:view())===p?'active':''}">${v2PageLabels[p]}</button>`).join('')}</nav><button class="btn v2-site-action btn-small" ${preview?'data-action="v2-preview-contact"':'data-go="customer/inquiry"'}>문의하기</button></header></div>`;}
function v2SitePhoto(s){return `<div class="v2-site-photo ${s.largePhoto?'large':''}">${s.photo?`<img src="${s.photo}" alt="${esc(s.name)} 대표 사진">`:icon(v2IconForIndustry(s.industry))}${!s.photo?`<div class="v2-photo-caption"><span>${esc(s.industry)}</span><span>브랜드 그래픽</span></div>`:''}</div>`;}
function v2SiteSection(s,key,preview=false){const dest=preview?'data-action="v2-preview-contact"':'data-go="customer/booking"';if(key==='hero')return `<section class="v2-site-hero"><div><div class="v2-site-kicker"><i class="dot"></i>${esc(s.region||s.industry)}</div><h1>${esc(s.headline)}</h1><p>${esc(s.description)}</p><div class="row"><button class="btn v2-site-action" ${dest}>예약 요청 ${icon('arrow','i16')}</button><button class="btn btn-secondary" ${preview?'data-action="v2-preview-contact"':'data-go="customer/contact"'}>${icon('sparkle','i16')}AI에게 물어보기</button></div></div>${v2SitePhoto(s)}</section>`;
if(key==='services')return `<section class="v2-site-section"><h2>필요한 서비스를 만나보세요.</h2><p>내용을 확인하고, 궁금한 점은 편하게 문의해 주세요.</p><div class="v2-site-service-grid">${s.services.map(x=>`<article class="v2-site-service">${icon(x.icon||'service')}<h3>${esc(x.name)}</h3><p>${esc(x.description||'세부 조건은 문의 후 안내해 드립니다.')}<br>약 ${x.duration}분 · 확인 후 예약 확정</p><strong>${x.price?money(x.price)+'원부터':'상담 후 견적'}</strong><button class="btn-link" ${preview?'data-action="v2-preview-contact"':`data-action="v2-book-service" data-id="${esc(x.id)}"`}>예약 요청 ${icon('arrow','i16')}</button></article>`).join('')}</div></section>`;
if(key==='about')return `<section class="v2-site-section"><h2>${esc(s.name)} 소개</h2><div class="v2-site-about"><p>${esc(s.intro||s.description)}</p><div><div class="summary-line"><span>활동 지역·방식</span><strong>${esc(s.region)}</strong></div><div class="summary-line"><span>연락 가능 시간</span><strong>${esc(s.hours)}</strong></div><div class="summary-line"><span>문의 방법</span><strong>사이트 문의${s.phoneButton?' · 전화':''}</strong></div></div></div></section>`;
if(key==='gallery')return `<section class="v2-site-section"><h2>작업과 공간</h2><p>직접 등록한 사진으로 소개합니다.</p><div class="mt24">${v2SitePhoto(s)}</div></section>`;
return `<section class="v2-site-section"><h2>자주 묻는 질문</h2>${[["예약하면 바로 확정되나요?","요청 내용을 확인한 뒤 사장님이 예약을 확정합니다. 시간 선택만으로 확정되지 않아요."],["어떻게 문의하나요?","AI 안내를 확인하거나 직접 문의 양식으로 연락처와 내용을 남겨주세요."],["서비스 대금은 어떻게 결제하나요?","이 사이트에서는 대금을 받지 않습니다. 최종 금액과 결제 방법은 사장님이 별도로 안내합니다."]].map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join('')}</section>`;}
function v2SiteMarkup(s,page='home',preview=false){let items=page==='home'?s.sections:[page==='about'?'about':page==='services'?'services':page==='gallery'?'gallery':'faq'];return `<div class="v2-site-page ${s.layout}" style="--site-accent:${s.accent};--site-soft:${s.soft}">${v2SiteHeader(s,preview)}<main class="v2-site-container">${items.map(x=>v2SiteSection(s,x,preview)).join('')}<footer class="v2-site-footer"><div><strong>${esc(s.name)}</strong><p>${esc(s.region)} · ${esc(s.hours)}</p></div><div><p>문의·예약으로 연결되는 나만의 사이트</p><button class="btn-link" ${preview?'data-action="v2-preview-contact"':'data-go="customer/inquiry"'}>직접 문의하기 ${icon('arrow','i16')}</button></div></footer></main></div>`;}
function v2EditorPanel(){const f=vf(),s=f.draft;if(!s)return '';let content='';if(f.panel==='content')content=`<h3>대표 소개</h3>${field('대표 문구',`<textarea data-draft="headline" maxlength="110">${esc(s.headline)}</textarea>`)}${field('설명',`<textarea data-draft="description" maxlength="350">${esc(s.description)}</textarea>`)}<h3>대표 사진</h3><label class="v2-photo-upload" style="padding:14px">${s.photo?`<img style="width:60px;height:55px" src="${s.photo}" alt="대표 사진">`:icon('image')}<div><strong>사진 ${s.photo?'변경':'추가'}</strong><span>내 사진으로 소개하세요.</span></div><input type="file" accept="image/jpeg,image/png,image/webp" data-v2-photo="draft" aria-label="편집기 대표 사진 선택"></label><h3>홈 섹션 순서</h3>${s.sections.map((x,i)=>`<div class="v2-component-row"><div class="row">${icon('menu','i16')}${v2SectionLabels[x]}</div><div class="row" style="gap:0"><button class="iconbtn" data-action="v2-section-up" data-index="${i}" aria-label="${v2SectionLabels[x]} 위로" ${i===0?'disabled':''}><span style="transform:rotate(-90deg)">${icon('chevron','i16')}</span></button><button class="iconbtn" data-action="v2-section-down" data-index="${i}" aria-label="${v2SectionLabels[x]} 아래로" ${i===s.sections.length-1?'disabled':''}><span style="transform:rotate(90deg)">${icon('chevron','i16')}</span></button></div></div>`).join('')}<p class="v2-editor-hint">문의·예약 기능은 디자인을 바꿔도 유지됩니다. 사업 정보 변경은 별도로 확인해 주세요.</p>`;
if(f.panel==='design')content=`<h3>디자인 구성</h3><div class="v2-mini-themes">${v2Layouts.map(l=>`<button data-action="v2-editor-layout" data-id="${l.id}" class="${s.layout===l.id?'active':''}"><i style="background:${l.soft}"></i><span class="grow">${l.name}</span>${s.layout===l.id?icon('check','i16'):''}</button>`).join('')}</div><h3>포인트 색상</h3><div class="v2-swatch-group">${v2Colors.map(([c,n])=>`<button style="background:${c}" class="${s.accent===c?'active':''}" aria-label="${n}" title="${n}" data-action="v2-color" data-color="${c}">${s.accent===c?icon('check','i16'):''}</button>`).join('')}</div><h3>사진 크기</h3><label class="v2-choice"><input type="checkbox" data-draft-check="largePhoto" ${s.largePhoto?'checked':''}><div><strong>사진 크게 보여주기</strong><span>작업·공간 중심으로 소개합니다.</span></div></label><p class="v2-editor-hint">준비된 구성요소 안에서 조합합니다. 모바일 배치와 14px 이상 글자 크기를 유지해요.</p>`;
if(f.panel==='pages')content=`<h3>내 사이트 페이지</h3>${s.pages.map(p=>`<div class="v2-page-row ${f.page===p?'active':''}"><button data-action="v2-preview-page" data-page="${p}">${icon(p==='home'?'home':'document','i16')}${v2PageLabels[p]}</button>${p!=='home'?`<button class="iconbtn" data-action="v2-page-remove" data-page="${p}" aria-label="${v2PageLabels[p]} 페이지 삭제">${icon('close','i16')}</button>`:''}</div>`).join('')}<button class="btn btn-secondary wfull mt16" data-action="v2-page-add" ${s.pages.length>=5?'disabled':''}>${icon('plus','i16')}페이지 추가</button><p class="v2-editor-hint">홈 하나로 시작하거나, 필요한 페이지를 최대 5개까지 추가할 수 있어요. 추가한 페이지는 메뉴에도 표시됩니다.</p>`;
return `<aside class="v2-editor-panel"><div class="v2-panel-tabs">${[['content','내용'],['design','디자인'],['pages','페이지']].map(([id,t])=>`<button class="${f.panel===id?'active':''}" data-action="v2-panel" data-panel="${id}">${t}</button>`).join('')}</div>${content}</aside>`;}
function v2Editor(){const f=vf();if(!f.draft)return v2BusinessForm();return `<div class="v2-wizard">${v2WizardHeader()}<div class="v2-edit-mobile-tabs"><button class="${f.editorTab==='preview'?'active':''}" data-action="v2-editor-tab" data-tab="preview">${icon('eye','i16')}미리보기</button><button class="${f.editorTab==='edit'?'active':''}" data-action="v2-editor-tab" data-tab="edit">${icon('sliders','i16')}내용·디자인 편집</button></div><div class="v2-editor-body ${f.editorTab==='edit'?'editing':''}">${v2EditorPanel()}<section class="v2-editor-preview-wrap"><div class="v2-preview-toolbar"><span class="row" style="gap:8px">${icon('lock','i16')}${esc(f.draft.name)} <span class="badge gray">미공개 초안</span></span><div class="device-buttons"><button class="iconbtn ${f.device==='desktop'?'active':''}" data-action="v2-canvas-device" data-device-mode="desktop" aria-label="사이트 데스크톱 미리보기">${icon('desktop')}</button><button class="iconbtn ${f.device==='mobile'?'active':''}" data-action="v2-canvas-device" data-device-mode="mobile" aria-label="사이트 모바일 미리보기">${icon('mobile')}</button></div></div><div class="v2-editor-preview ${f.device==='mobile'?'mobile':''}" id="v2-canvas">${v2SiteMarkup(f.draft,f.page,true)}</div><form class="v2-ai-command" data-form="v2-edit-ai">${icon('sparkle')}<input name="prompt" placeholder="AI에게 수정 요청 · 예: 네이비로 바꿔줘" aria-label="AI 수정 요청" required><button class="btn btn-primary"><span>초안 수정</span>${icon('arrow','i16')}</button></form><div class="v2-editor-disclosure" id="v2-ai-result">${esc(f.aiResult||'초안만 수정 · 공개는 직접 확인 · AI는 키워드 기반 시연')}</div><div class="v2-editor-pills">${['네이비로 변경','서비스를 먼저 보여줘','사진을 크게 보여줘'].map(t=>`<button data-action="v2-edit-prompt" data-prompt="${t}">${t}</button>`).join('')}</div></section></div><footer class="v2-stepfoot"><span class="small">${f.published?'고객 사이트는 마지막 공개 버전을 유지해요.':'STEP 03 / 05 · 직접 수정하거나 AI와 함께 다듬으세요.'}</span><div class="row"><button class="btn btn-secondary" data-action="${f.published?'v2-history':'v2-back-design'}">${icon(f.published?'history':'left','i16')}${f.published?'공개 이력':'디자인 선택'}</button><button class="btn btn-primary" data-go="${f.published?'create/publish':'create/connect'}">${f.published?'변경사항 검토':'연락·예약 설정'} ${icon('arrow','i16')}</button></div></footer></div>`;}
function v2Connect(){const f=vf(),s=f.draft||f.business;return v2WizardFrame('connect',`${v2StepTitle('connect','고객과 어떻게 연결할까요?','문의는 내 관리실로, 중요한 알림은 사장님의 휴대전화로 연결됩니다.')}<form id="v2-connect-form" data-form="v2-connect"><div class="v2-connect-grid"><section class="v2-form-block"><h2>연락받을 번호</h2>${field('사업자 휴대전화',`<input class="input" data-business="phone" value="${esc(f.business.phone)}" inputmode="tel" placeholder="010-0000-0000" required pattern="[0-9+() -]{10,18}">`,'알림 수신용 번호입니다. 시안에서는 실제 발송하지 않아요.')}<label class="checkline mt16"><input type="checkbox" data-flow-check="phoneButton" ${f.phoneButton?'checked':''}>사이트에 이 번호로 전화하기 버튼 표시</label><h2 class="mt32">예약 요청 방식</h2><div class="v2-option-list"><label class="v2-choice"><input type="radio" name="bookingMode" data-flow="bookingMode" value="preferred" ${f.bookingMode==='preferred'?'checked':''}><div><strong>희망 날짜·시간 받기</strong><span>고객이 원하는 시간을 남기면 일정을 조율해요.</span></div></label><label class="v2-choice"><input type="radio" name="bookingMode" data-flow="bookingMode" value="slot" ${f.bookingMode==='slot'?'checked':''}><div><strong>시간표에서 선택</strong><span>운영시간과 등록된 일정을 바탕으로 요청을 받아요.</span></div></label></div><div class="mt20" style="margin-top:20px">${field('고객 안내 운영시간',`<input class="input" data-business="hours" value="${esc(f.business.hours)}" required>`)}</div><p class="v2-inline-info">${icon('info','i16')}어느 방식이든 사장님이 확인한 뒤 예약을 확정합니다.</p></section><section class="v2-form-block"><h2>사장님 알림</h2><div class="v2-option-list"><label class="v2-choice"><input type="checkbox" data-flow-check="kakao" ${f.kakao?'checked':''}><div><strong>카카오톡 업무 알림</strong><span>직접 확인할 문의·예약 요청이 있을 때</span></div>${icon('chat','i16')}</label><label class="v2-choice"><input type="checkbox" data-flow-check="push" ${f.push?'checked':''}><div><strong>웹 푸시</strong><span>사용 중인 브라우저·기기로 알림 받기</span></div>${icon('bell','i16')}</label></div><button type="button" class="btn-link mt16" data-action="v2-notification-test">${icon('bell','i16')}알림 테스트 화면 보 askPublic=function(text){const s=vf().published;state.publicChat.push({by:'customer',text,time:'방금'});let answer=/지역|어디|방문/.test(text)?'등록된 활동 지역·방식은 '+s.region+'입니다. 세부 조건은 사장님에게 문의해 주세요.':/가격|금액|얼마|서비스/.test(text)?s.services.map(x=>x.name+': '+(x.price?money(x.price)+'원부터':'상담 후 견적')).join(' / ')+'. 최종 조건은 사장님이 확인합니다.':/예약|시간|일정|언제/.test(text)?'연락 가능 시간은 '+s.hours+'입니다. 예약은 사장님이 확인한 뒤 확정됩니다.':'승인된 정보만으로 정확히 안내하기 어려워요. 직접 문의를 남기면 사장님이 확인합니다.';if(!state.aiEnabled)answer='AI 안내가 쉬고 있어요. 직접 문의 양식으로 남겨주세요.';state.publicChat.push({by:'ai',text:answer,time:'방금'});save();render();};
publicBooking=function(){state.bookingMode=svc(state.bookingService).mode||vf().published.bookingMode;let h=v2Legacy.publicBooking();h=h.replace(/<div class="pill-tabs in-card mb16"[\s\S]*?<\/div><p class="field-note mb16">[\s\S]*?<\/p>/,'');h=h.replaceAll('방문을 요청해 주세요.','예약을 요청해 주세요.').replaceAll('방문 서비스',esc(vf().published.industry)).replace('<option>서울 서초구</option><option>서울 강남구</option><option>다른 지역 · 방문 가능 여부 확인</option>',`<option>${esc(vf().published.region)}</option><option>다른 지역·방식 문의</option>`);return h;};

function v2ApplyExample(id){const samples={car:{name:'클린드라이브',industry:'출장 세차',region:'성남 분당·판교',intro:'바쁜 하루, 세차는 맡겨두세요. 원하는 곳으로 찾아가 차량을 깨끗하게 관리합니다.',phone:'010-0000-0000',services:[['외부 세차',35000,60],['실내·외 세차',60000,90]],slug:'cleandrive'},photo:{name:'스튜디오 여백',industry:'사진·촬영',region:'서울 성수동 · 스튜디오 촬영',intro:'자연스러운 표정과 나다운 분위기를 담습니다. 프로필부터 소중한 일상의 기록까지 함께합니다.',phone:'010-0000-0000',services:[['프로필 촬영',150000,60],['커플 스냅',200000,90]],slug:'yeobaek'},lesson:{name:'모아 피아노',industry:'레슨·교육',region:'서울 마포구 · 방문 레슨',intro:'처음 배우는 마음부터 다시 시작하는 즐거움까지. 나에게 맞는 속도로 음악을 배워보세요.',phone:'010-0000-0000',services:[['성인 개인 레슨',50000,60],['체험 수업',25000,30]],slug:'moa-piano'}};const e=samples[id]||samples.car;vf().business={...vf().business,...e,services:e.services.map(([name,price,duration],i)=>({id:'s'+(i+1),name,price,duration,description:'',icon:v2IconForIndustry(e.industry),mode:vf().bookingMode}))};vf().slug=e.slug;v2Persist();render();toast('예시 사업 정보를 입력했어요. 원하는 내용으로 바꿔주세요.');}
function v2Next(step){if(step==='business'){const form=document.getElementById('v2-business-form');if(!form?.reportValidity())return;if(!v2BuildAvailable()){toast('상호·소개·서비스를 입력해 주세요.');return;}if(vf().draft){const d=vf().draft,b=vf().business;Object.assign(d,{name:b.name,industry:b.industry,region:b.region,intro:b.intro,photo:b.photo,services:v2NormalizeServices(b.services)});}v2Persist();go('create/design');}else if(step==='connect'){const form=document.getElementById('v2-connect-form');if(!form?.reportValidity())return;const raw=vf().business.phone.replace(/\D/g,'');if(raw.length<10||raw.length>11){toast('전화번호 형식을 확인해 주세요.');return;}if(!vf().kakao&&!vf().push){toast('사장님 알림을 한 가지 이상 선택해 주세요.');return;}Object.assign(vf().draft,{phone:vf().business.phone,hours:vf().business.hours,phoneButton:vf().phoneButton,bookingMode:vf().bookingMode});vf().draft.services.forEach(s=>{if(!s.modeOverride)s.mode=vf().bookingMode;});v2Persist();go('create/publish');}}
function v2RunGenerate(){if(!v2BuildAvailable()){go('create/business');toast('먼저 사업 정보를 입력해 주세요.');return;}const f=vf();if(f.method==='ai'){if(!f.prompt.trim()){toast('원하는 디자인을 설명해 주세요.');return;}if(/사진|잡지|스튜디오|에디토리얼/.test(f.prompt))f.template='editorial';else if(/베이지|따뜻|부드러|웜/.test(f.prompt))f.template='warm';else f.template='essential';}const target=document.getElementById('v2-generation');if(target)target.innerHTML=`<div class="v2-generation-mask">${icon('sparkle','i28')}<div><strong>${esc(f.business.name)}의 초안을 구성하고 있어요.</strong><p>사업 정보 · 서비스 목록 · 선택한 디자인 연결</p></div></div>`;document.querySelectorAll('[data-action="v2-generate"]').forEach(b=>b.disabled=true);setTimeout(()=>{const prev=f.draft&&f.draft.name===f.business.name?structuredClone(f.draft):null;v2MakeDraft();if(prev){Object.assign(f.draft,{headline:prev.headline,description:prev.description,pages:prev.pages,sections:prev.sections,largePhoto:prev.largePhoto});}if(f.method==='ai'){v2ApplyPrompt(f.prompt,false);}go('create/editor');toast('입력한 사업 정보로 초안을 만들었어요. 고객에게는 아직 공개되지 않았습니다.');},650);}
function v2ApplyPrompt(text,show=true){let s=vf().draft;if(!s)return;let changes=[];if(/네이비/.test(text)){s.accent='#263c55';s.soft='#edf1f6';changes.push('네이비 색상');}else if(/블루|파랑|파란/.test(text)){s.accent='#345d84';s.soft='#edf3f8';changes.push('블루 색상');}else if(/베이지|샌드/.test(text)){s.accent='#82664a';s.soft='#f5eee4';changes.push('샌드 색상');}if(/사진.*크게|큰 사진/.test(text)){s.largePhoto=true;changes.push('큰 대표 사진');}if(/서비스.*먼저|서비스.*위/.test(text)){s.sections=['services',...s.sections.filter(x=>x!=='services')];changes.push('서비스 섹션 우선');}if(/대표.*문구.*["“'「]/.test(text)){const m=text.match(/["“'「]([^"”'」]+)["”'」]/);if(m){s.headline=m[1];changes.push('대표 문구');}}else if(/간결|짧게/.test(text)){s.headline=s.name+'와 함께.\n'+(s.services[0]?.name||'새로운 시작')+'.';changes.push('간결한 대표 문구');}if(/잡지|에디토리얼/.test(text)){s.layout='editorial';changes.push('에디토리얼 배치');}vf().aiResult=changes.length?changes.join(' · ')+'를 초안에 반영했어요. 실제 AI 미연결.':'이 시안은 색상·사진 크기·섹션 순서·따옴표 안 대표 문구 수정을 시연합니다.';v2Persist();if(show){render();toast(changes.length?'초안을 수정했어요. 공개 사이트는 바뀌지 않습니다.':'지원하는 예시 요청을 사용하거나 직접 편집해 주세요.');}}
function v2PublishNow(){const f=vf(),s=f.draft;if(!s)return;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(f.slug)||f.slug.length>40){toast('주소는 영문 소문자·숫자·하이픈으로 입력해 주세요.');document.querySelector('[data-flow="slug"]')?.focus();return;}if(!f.business.phone){toast('연락받을 번호를 먼저 설정해 주세요.');go('create/connect');return;}if(!f.consent){toast('사업 정보·연락처 확인에 체크해 주세요.');return;}if(f.published)f.versions.unshift({site:structuredClone(f.published),revision:state.revision,savedAt:new Date().toLocaleString('ko-KR')});Object.assign(s,{phone:f.business.phone,hours:f.business.hours,phoneButton:f.phoneButton,bookingMode:f.bookingMode,slug:f.slug});s.services.forEach(x=>{if(!x.modeOverride)x.mode=f.bookingMode;});f.published=structuredClone(s);state.revision++;state.publishedTitle=s.headline;state.draftTitle=s.headline;state.bookingService=s.services[0]?.id||'s1';state.bookingMode=f.bookingMode;state.kakaoEnabled=f.kakao;state.pushEnabled=f.push;f.consent=false;v2Persist();go('create/success');}

function agentOverview3(){if(!b3().facts)return `${heading('내 사업 AI','홈페이지와 독립적으로 사업자를 대표하는 AI입니다.')}${empty3('내 사업을 아는 AI를 만들어보세요.','등록한 서비스와 가격, 지역, FAQ로 안내하고 실제 문의를 관리실로 연결합니다.',goBtn('AI 설정 시작','owner/agent-setup','btn-primary','sparkle'))}`;return `${heading('내 사업 AI','같은 사업 정보로, 모든 접점에서 일관되게 안내해요.',btn(activeAgent()?'안내 일시 중지':'안내 다시 시작','v3-agent-toggle',activeAgent()?'btn-secondary':'btn-primary',activeAgent()?'pause':'sparkle'))}${agentTabs3()}<div class="v3-grid2"><section class="v3-agent-profile"><div class="row-between"><div class="row"><div class="v3-agent-logo">${icon('sparkle')}</div><div><h2>${esc(b3().agentName||ownerName()+' AI')}</h2><p class="small muted mt8">${esc(ownerName())}를 대표하는 AI 안내</p></div></div>${badge(activeAgent()?'안내 중':'중지됨',activeAgent()?'green':'amber')}</div><p>등록하고 승인한 내용만 안내합니다. 실제 답변과 예약 확정은 사장님이 직접 처리해요.</p>${[['서비스·가격 안내','승인된 카탈로그와 정책을 사용합니다.'],['문의 정리·사람 연결','답변이 필요한 내용만 관리실로 전달합니다.'],['예약 요청 연결','시간을 확인해 요청을 받고, 자동 확정하지 않습니다.']].map(([t,p])=>`<div class="v3-capability">${icon('checkcircle')}<div><strong>${t}</strong><p class="small muted mt8">${p}</p></div></div>`).join('')}<div class="row wrap mt24">${goBtn('답변 테스트','owner/agent-test','btn-primary','chat')}${goBtn('승인 정보 수정','owner/agent-knowledge','btn-secondary','edit')}</div><div class="v3-agent-facts">${[['정보 버전','v'+b3().knowledgeRevision],['등록 서비스',allServices().length+'개'],['응대 말투',b3().agentTone],['독립 상담','홈페이지 공개 여부와 무관하게 이용']].map(([k,v])=>`<div class="summary-line"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></section><aside class="stack"><section class="v3-card"><h2>고객을 만나는 곳</h2>${[['globe','내 홈페이지',vf().published?'사이트 문의와 연결됨':'홈페이지 없이 AI 단독 이용','customer/home'],['link','공유 상담 링크','프로필·소개 메시지·명함에 활용','owner/distribution'],['document','제휴 콘텐츠 카드',b3().placements.filter(p=>p.status==='approved').length+'개 배치 승인','owner/campaigns']].map(([i,t,p,r])=>`<div class="v3-link-row"><div class="v3-link-icon">${icon(i)}</div><div class="grow"><h3>${t}</h3><p>${p}</p></div>${goBtn('보기',r,'btn-link','chevron')}</div>`).join('')}</section><div class="v3-soft">${icon('shield','i16')}<p class="small mt8">AI에는 예약 확정·가격 할인·사이트 공개·고객 대금 결제 권한이 없습니다.</p></div></aside></div>`;}
function agentSetup3(){const s=b3().facts||vf().business;return `${heading('내 사업 AI 만들기','홈페이지가 없어도 시작할 수 있어요. 직접 등록한 정보만 사용합니다.')}<form data-form="v3-agent-setup" class="v3-grid2"><section class="v3-card v3-form-stack">${field('상호',`<input class="input" name="name" value="${esc(s.name)}" placeholder="예: 클린드라이브" required maxlength="50">`)}${field('사업 소개',`<textarea name="intro" required placeholder="어떤 서비스를 제공하시나요?">${esc(s.intro||'')}</textarea>`)}<div class="form-grid">${field('업종',`<select class="select" name="industry">${v2Industries.map(i=>`<option ${i===s.industry?'selected':''}>${i}</option>`).join('')}</select>`)}${field('활동 지역·이용 방식',`<input class="input" name="region" value="${esc(s.region)}" placeholder="분당·판교 / 온라인 등" required>`)}</div><div class="form-grid">${field('첫 서비스',`<input class="input" name="service" value="${esc(s.services?.[0]?.name||'')}" required placeholder="예: 실내·외 세차">`)}${field('가격 (원, 비우면 상담 후 견적)',`<input class="input" type="number" min="0" name="price" value="${s.services?.[0]?.price||''}">`)}</div><div class="form-grid">${field('서비스 소요시간 (분)',`<input class="input" type="number" name="duration" min="15" max="720" value="${s.services?.[0]?.duration||60}" required>`)}${field('알림받을 휴대전화',`<input class="input" name="phone" value="${esc(s.phone)}" inputmode="tel" required placeholder="010-0000-0000">`)}</div>${field('운영시간',`<input class="input" name="hours" value="${esc(s.hours||'평일 09:00–18:00')}" required>`)}<label class="v3-check"><input type="checkbox" name="consent" required>입력한 정보로 AI 안내를 활성화합니다. 실제 전화번호 확인·알림은 운영 연동이 필요합니다.</label><button class="btn btn-primary btn-lg">승인하고 AI 활성화 ${icon('arrow')}</button></section><aside class="v3-card"><div class="v3-agent-logo">${icon('sparkle')}</div><h2 class="mt24">직접 제작하지 않아도,<br>상담창은 바로 시작.</h2><p class="mt16">AI 단독 이용은 홈페이지를 만들지 않습니다. 사업 정보·문의함·예약·알림을 함께 준비하는 경로입니다.</p><div class="v3-micro-flow"><span>사업 정보</span>${icon('arrow','i16')}<span>승인</span>${icon('arrow','i16')}<span>상담 공유</span></div><div class="v3-soft">서비스 추가와 FAQ는 관리실에서 이어서 설정할 수 있습니다.</div></aside></form>`;}
function knowledge3(){const s=b3().knowledgeEdit||b3().facts;if(!s)return agentOverview3();return `${heading('승인 정보','홈페이지·상담 링크·홍보 카드가 같은 정보를 사용합니다.')}${agentTabs3()}<form data-form="v3-knowledge" class="v3-grid2"><section class="v3-card v3-form-stack">${field('사업 소개',`<textarea name="intro" required>${esc(s.intro||s.description)}</textarea>`)}<div class="form-grid">${field('활동 지역',`<input class="input" name="region" value="${esc(s.region)}" required>`)}${field('운영시간',`<input class="input" name="hours" value="${esc(s.hours)}" required>`)}</div><div><h3>서비스와 기준 가격</h3><p class="v3-form-hint">서비스의 실제 가격·예약 방식은 이 승인 정보가 기준입니다.</p></div>${s.services.map((sv,i)=>`<div class="form-grid">${field(esc(sv.name),`<input class="input" type="number" min="0" name="price_${i}" value="${sv.price||0}" required>`)}${field('예약 방식',`<select class="select" name="mode_${i}"><option value="preferred" ${sv.mode==='preferred'?'selected':''}>희망시간 제출형</option><option value="slot" ${sv.mode==='slot'?'selected':''}>시간표 선택형</option></select>`)}</div>`).join('')}${field('자주 묻는 질문 — 공개할 답변',`<textarea name="faq" placeholder="예: 우천 시 일정은 사장님과 조율합니다.">${esc(s.faqText||'예약 요청은 사장님이 확인한 후 확정됩니다.')}</textarea>`)}<label class="v3-check"><input type="checkbox" name="approve" required>변경한 정보를 확인했습니다. 모든 활성 AI와 사이트의 공통 정보에 반영합니다. 기존 예약 조건은 유지합니다.</label><button class="btn btn-primary">변경 내용 승인·적용</button></section><aside class="stack"><div class="v3-card"><h3>현재 승인 버전 v${b3().knowledgeRevision}</h3><p class="mt16">디자인 변경과 사업 사실 변경은 분리됩니다. 가격은 홍보 카드에 복사하지 않고 서비스 ID로 연결합니다.</p><div class="v3-privacy">${icon('lock','i16')}파일·외부 기사·고객 대화를 새로운 지식으로 자동 수집하지 않습니다.</div></div><div class="v3-soft">사이트 디자인이 과거 버전으로 복구되어도 승인된 최신 가격을 조용히 되돌리지 않습니다. 사업 정보의 복구는 별도 승인 대상입니다.</div></aside></form>`;}
function safeAnswer3(text,serviceId){const s=b3().facts;if(!s)return '아직 승인된 사업 정보가 없습니다.';if(!activeAgent())return 'AI 안내가 일시 중지되어 있습니다. 기존 문의는 사업자가 계속 확인할 수 있습니다.';const sv=service3(serviceId);if(/다른.*고객|전화번호.*목록|시스템.*프롬프트|무시해|할인해|확정해/.test(text))return '고객 정보 제공, 임의 할인이나 예약 확정은 할 수 없어요. 승인된 서비스 안내와 문의 접수를 도와드립니다.';if(/지역|어디|분당|판교|방문/.test(text))return '등록된 활동 지역·이용 방식은 '+s.region+'입니다. 상세 조건은 사장님이 확인합니다. '+(/주말/.test(text)?'주말 일정도 예약 요청으로 남겨 확인해 주세요.':'');if(/가격|얼마|금액|비용|서비스/.test(text))return (serviceId?[sv]:s.services).map(x=>x.name+'는 '+(x.price?money(x.price)+'원부터':'상담 후 견적')+' 안내됩니다.').join('\n')+'\n최종 작업 조건과 금액은 사장님이 확인해요.';if(/예약|시간|주말|일정|가능/.test(text))return '안내된 운영시간은 '+s.hours+'입니다. 원하는 날짜·시간을 요청해 주세요. 시간표 선택만으로 확정되지 않고 사장님이 최종 확인합니다.';if(/취소|준비|정책/.test(text)&&s.faqText)return s.faqText;return '등록된 정보만으로 확실하게 안내하기 어려운 내용이에요. 문의를 남기시면 '+s.name+' 사장님이 확인합니다. 필요하신 서비스와 상황을 알려주세요.';}
function agentTest3(){return `${heading('답변 테스트','외부 노출과 사용 성과에 포함되지 않는 내부 테스트입니다.')}${agentTabs3()}<div class="v3-grid2"><section class="v3-card"><div class="row-between"><h2>고객처럼 질문해 보세요.</h2>${badge('내부 테스트','gray')}</div><div class="v3-quick">${['가격이 얼마인가요?','어느 지역에 방문하나요?','지금 예약 확정해 줘'].map(t=>`<button data-action="v3-test-q" data-text="${esc(t)}">${t}</button>`).join('')}</div><form data-form="v3-test"><div class="row"><input class="input" name="question" value="${esc(b3().testInput)}" placeholder="고객이 물어볼 질문" required><button class="btn btn-primary">테스트</button></div></form>${b3().testAnswer?`<div class="v3-message mt24"><span class="v3-message-label">${icon('sparkle','i16')}AI 답변 시연</span>${esc(b3().testAnswer)}</div><p class="v3-note-plain">참고: 승인 정보 v${b3().knowledgeRevision} · 실제 LLM이 아닌 로컬 규칙 기반 시연</p>`:''}</section><aside class="v3-card"><h3>확인해야 할 동작</h3>${['승인되지 않은 가격을 만들지 않는가','모르는 질문을 사업자에게 넘기는가','일정 선택을 확정으로 말하지 않는가','다른 고객·사업자의 정보를 공개하지 않는가'].map(t=>`<div class="v3-capability">${icon('checkcircle','i16')}<span>${t}</span></div>`).join('')}</aside></div>`;}
function campaignCard3(c){const live=c.live;return `<article class="v3-card v3-campaign-card"><div class="row-between"><h3>${esc(c.name)}</h3>${badge(c.status==='active'?'활성':c.status==='paused'?'일시 중지':'미공개 초안',c.status==='active'?'green':c.status==='paused'?'amber':'gray')}</div><div class="v3-preview-strip"><span class="small muted">${esc(ownerName())} · AI 안내</span><h3>${esc(live?.title||c.draft.title)}</h3><p class="small muted">${esc(service3(c.draft.serviceId).name)} · ${c.draft.goal==='booking'?'예약 요청':'일반 문의'} 연결</p></div><div class="v3-campaign-mini">공개 버전 ${c.revision?'v'+c.revision:'없음'}${c.dirty?' · 공개되지 않은 수정 있음':''}</div><div class="v3-card-foot"><button class="btn btn-primary btn-small" data-action="v3-edit-campaign" data-id="${c.id}">편집</button><button class="btn btn-secondary btn-small" data-action="v3-preview-campaign" data-id="${c.id}">미리보기</button>${c.live?`<button class="btn-link" data-action="v3-toggle-campaign" data-id="${c.id}">${c.status==='active'?'중지':'다시 시작'}</button>`:''}</div></article>`;}
function campaigns3(){return `${heading('홍보 카드','서비스에 맞춘 대화 시작점을 만들고, 필요한 곳에 공유하세요.',btn('홍보 카드 만들기','v3-new-campaign','btn-primary','plus'))}<div class="v3-soft mb16">사업자의 AI는 하나입니다. 카드별로 첫 문구와 질문은 달라도 가격·정책은 같은 승인 정보를 사용합니다.</div>${b3().campaigns.length?`<div class="v3-grid3">${b3().campaigns.map(campaignCard3).join('')}</div>`:empty3('첫 홍보 카드를 만들어보세요.','소개할 서비스를 선택하면 상담 링크와 외부 대화형 카드로 함께 활용할 수 있어요.',btn('새 카드 만들기','v3-new-campaign','btn-primary','plus'))}`;}
function currentCreative3(c,preview=false){return preview?c?.draft:c?.live;}
function ad3(cid,context='article',preview=false){const c=campaign(cid),creative=currentCreative3(c,preview)||{title:'궁금한 점을 바로 물어보세요.',intro:'등록된 서비스와 이용 조건을 안내합니다.',questions:['서비스 가격','가능한 지역','예약 문의'],serviceId:allServices()[0]?.id,goal:'inquiry'};const placement=context==='article'?b3().placements.find(p=>p.campaignId===cid&&p.status==='approved'&&b3().publisher.slots.some(s=>s.id===p.slotId&&s.active)&&p.revision===c?.revision):null;const unavailable=!preview&&(!activeAgent()||(c&&c.status!=='active')||(context==='article'&&!placement));const ses=b3().activeSession?b3().conversations[b3().activeSession]:null;const same=ses?.campaignId===cid&&ses?.context===context;return `<section class="v3-ad" id="v3-live-ad"><div class="v3-ad-top"><span>${context==='article'?'광고 · ':''}사업자 AI 안내</span><span>${preview?'미공개 미리보기':esc(ownerName())}</span></div>${unavailable?`<div class="v3-ad-paused">${icon('pause')}<h3 class="mt16">지금은 안내를 쉬고 있어요.</h3><p>활성 상태와 매체의 배치 승인을 확인해 주세요.</p>${preview?'':goBtn('사업자에게 직접 문의','customer/inquiry','btn-secondary')}</div>`:`<div class="v3-ad-body"><div class="row"><div class="v3-agent-logo">${icon('sparkle')}</div><div><strong>${esc(ownerName())}</strong><p class="small muted mt8">${esc(service3(creative.serviceId).name)}</p></div></div><h2>${esc(creative.title)}</h2><p>${esc(creative.intro)}</p><div class="v3-quick">${(creative.questions||[]).map(q=>`<button data-action="${preview?'v3-preview-q':'v3-ad-q'}" data-id="${esc(cid||'own')}" data-context="${context}" data-text="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>${same&&!preview?`<div class="v3-dialogue">${ses.messages.map(m=>`<div class="v3-message ${m.by==='customer'?'mine':''}"><span class="v3-message-label">${m.by==='customer'?'나':esc(ownerName())+' AI'}</span>${esc(m.text)}</div>`).join('')}</div>`:''}${!preview?`<form class="v3-composer" data-form="v3-ad-chat"><input type="hidden" name="campaign" value="${esc(cid||'own')}"><input type="hidden" name="context" value="${context}"><input name="message" placeholder="궁금한 내용을 물어보세요" aria-label="AI에게 질문" required maxlength="1000"><button class="btn btn-primary" aria-label="질문 보내기">${icon('arrow')}</button></form><div style="padding:0 20px 18px"><button class="btn btn-secondary wfull" data-action="v3-to-intake" data-id="${esc(cid||'own')}" data-context="${context}" data-type="${creative.goal}">${creative.goal==='booking'?'예약 요청하기':'사장님께 문의하기'} ${icon('arrow','i16')}</button></div>`:''}`}<div class="v3-ad-bottom">${preview?'이 미리보기는 노출·대화 성과에 포함되지 않습니다.':'AI 답변은 안내이며 예약 확정이 아닙니다. 연락처는 다음 접수 화면에서만 받습니다.'}</div></section>`;}
function campaignEditor3(){const c=selectedCampaign();if(!c)return campaigns3();const d=c.draft;return `${heading('홍보 카드 편집','초안과 공개본은 분리됩니다. 직접 승인해야 고객에게 반영됩니다.',`<div class="row wrap">${goBtn('목록','owner/campaigns','btn-secondary')}${btn('검토 후 공개','v3-publish-campaign','btn-primary','upload')}</div>`)}<div class="v3-grid2"><form data-form="v3-campaign-save" class="v3-card v3-form-stack">${field('관리용 이름',`<input class="input" data-campaign-field="name" value="${esc(c.name)}" required maxlength="60">`)}<div class="form-grid">${field('연결할 서비스',`<select class="select" data-creative="serviceId">${allServices().map(s=>`<option value="${s.id}" ${d.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`)}${field('연결할 행동',`<select class="select" data-creative="goal"><option value="inquiry" ${d.goal==='inquiry'?'selected':''}>일반 문의</option><option value="booking" ${d.goal==='booking'?'selected':''}>예약 요청</option></select>`)}</div>${field('고객에게 보여줄 제목',`<input class="input" data-creative="title" value="${esc(d.title)}" required maxlength="100">`)}${field('소개 문구',`<textarea data-creative="intro" maxlength="300">${esc(d.intro)}</textarea>`)}${field('추천 질문 (한 줄에 하나, 최대 3개)',`<textarea data-creative="questions" rows="3">${esc(d.questions.join('\n'))}</textarea>`)}<div class="v3-soft">가격은 직접 입력하지 않고 승인된 서비스 정보에서 가져옵니다. 허위 후기·임의 할인·자동 예약 확정 문구를 넣지 마세요.</div><div class="row-between"><span class="small muted" id="v3-campaign-saved">${c.dirty?'미공개 변경 있음':'저장됨'} · 브라우저 저장</span><button class="btn btn-secondary">초안 저장</button></div></form><aside><div class="row-between mb16"><strong>고객 화면 미리보기</strong>${badge('초안','gray')}</div><div id="v3-campaign-preview">${ad3(c.id,'preview',true)}</div><div class="v3-privacy">${icon('shield','i16')}외부 매체의 카드는 공개 후 매체의 별도 배치 승인이 필요합니다. 내용을 바꾸면 새 버전 승인을 요청합니다.</div></aside></div>`;}
function distribution3(){if(!b3().facts)return agentOverview3();return `${heading('공유·설치','내 AI를 고객이 있는 곳에 연결하세요. 외부 노출 위치는 별도로 확보합니다.',goBtn('홍보 카드 만들기','owner/campaigns','btn-primary','plus'))}<div class="v3-grid-equal"><section class="v3-card"><div class="v3-link-icon">${icon('link')}</div><h2 class="mt24">공유 상담 링크</h2><p>홈페이지 없이도 고객이 들어와 질문하고 요청을 남길 수 있어요.</p><code class="v3-code mt24">https://chat.field.example/a/${esc(vf().slug||'my-business')}</code><div class="row wrap mt16">${btn('시안 대화 열기','v3-open-own-agent','btn-primary','external')}${btn('현재 시안 링크 복사','v3-copy-agent','btn-secondary','copy')}</div><p class="v3-note-plain">위 도메인은 배포 예시입니다. 복사되는 로컬 시안 링크는 이 파일·브라우저의 상태에서만 작동합니다.</p></section><section class="v3-card"><div class="v3-link-icon">${icon('globe')}</div><h2 class="mt24">기존 홈페이지에 설치</h2><p>기존 사이트를 교체하지 않고 상담 버튼이나 대화형 카드로 연결합니다.</p>${field('설치를 허용할 도메인',`<input class="input mt16" id="v3-own-domain" value="${esc(b3().ownDomain||'')}" placeholder="www.my-business.com">`)}<div class="row wrap mt16">${btn('설치 코드 확인','v3-install-code','btn-secondary','document')}${btn('도메인 저장','v3-save-own-domain','btn-primary')}</div><p class="v3-note-plain">도메인 저장은 실제 소유권 검증이 아닙니다. 운영 서비스에서는 HTTPS·소유권·삽입 정책을 확인해야 합니다.</p></section></div><section class="v3-card mt24"><div class="section-head"><div><h2>제휴 매체 배치</h2><p>사업자가 연결을 요청하고, 매체가 해당 카드·위치를 승인합니다.</p></div>${btn('배치 요청','v3-request-placement','btn-primary','plus')}</div>${b3().placements.length?b3().placements.map(p=>{const c=campaign(p.campaignId);return `<div class="v3-list-row"><div class="v3-link-icon">${icon('document')}</div><div class="grow"><strong>${esc(c?.name||'삭제된 카드')}</strong><p>${esc(b3().publisher.name)} · ${esc(b3().publisher.slots.find(x=>x.id===p.slotId)?.name||'본문 카드')} · v${p.revision}</p></div>${badge(p.status==='approved'?'배치 승인':p.status==='suspended'?'운영 제한':'승인 대기',p.status==='approved'?'green':p.status==='suspended'?'red':'amber')}<button class="btn btn-secondary btn-small" data-action=" function performance3(isPub=false){const threads=state.conversations.filter(c=>c.sourceCampaign),count=type=>b3().events.filter(e=>e.type===type&&!e.test).length;return `${heading(isPub?'집계 성과':'유입·성과',isPub?'매체에는 집계만 제공됩니다. 고객 개인정보·대화 원문은 포함하지 않습니다.':'외부 대화가 실제 문의와 예약으로 이어졌는지 확인하세요.',btn('집계 JSON 내보내기','v3-export-metrics','btn-secondary','download'))}<div class="v3-stats">${stat3('카드 열람',count('impression'),'시안 진입 횟수')}${stat3('대화 시작',count('conversation_started'),'질문을 보낸 세션')}${stat3('문의 접수',isPub&&threads.length<5?'—':threads.length,isPub?'5건 미만은 비공개':'연락처·내용 제출 완료')}${stat3('예약 확정',isPub&&threads.length<5?'—':threads.filter(x=>x.booking==='확정').length,'매출과 다른 지표')}</div><div class="v3-grid2"><section class="v3-card"><h2>배포별 연결 결과</h2>${b3().campaigns.length?b3().campaigns.map(c=>{const t=threads.filter(t=>t.sourceCampaign===c.id);return `<div class="v3-list-row"><div class="grow"><strong>${esc(c.name)}</strong><p>${esc(service3(c.draft.serviceId).name)}</p></div>${isPub&&t.length<5?badge('표본 부족','gray'):`<span class="small">문의 ${t.length} · 확정 ${t.filter(x=>x.booking==='확정').length}</span>`}</div>`;}).join(''):`<p class="muted mt24">아직 배포한 카드가 없습니다.</p>`}</section><aside class="v3-card"><h3>이 숫자가 뜻하는 것</h3><p class="mt16">카드 열람, 대화, 접수, 예약은 서로 다른 단계입니다. 테스트와 스팸은 실제 성과에서 제외해야 합니다.</p><div class="v3-soft mt24">이 시안의 숫자는 브라우저 안에서 발생한 이벤트입니다. 광고 구매·실제 매체 트래픽·매출을 나타내지 않습니다.</div><div class="v3-privacy">${icon('lock','i16')}${isPub?'5건 미만의 전환값과 개인별 이력은 표시하지 않습니다.':'출처는 현재 대화의 배포 위치로 고정됩니다. 실서비스에서는 서버 발급 배포 세션으로 검증합니다.'}</div></aside></div>`;}
function publisher3(){const sub=view();if(sub==='overview')return `${heading('콘텐츠와 대화의 연결','독자 경험을 해치지 않는 대화형 홍보를 운영하세요.',goBtn('배치 요청 확인','publisher/requests','btn-primary','checkbook'))}<div class="v3-stats">${stat3('등록된 매체',1,b3().publisher.domain)}${stat3('노출 위치',b3().publisher.slots.length,'직접 등록한 영역')}${stat3('승인 대기',b3().placements.filter(p=>p.status==='requested').length,'버전별 배치 요청')}${stat3('활성 배치',b3().placements.filter(p=>p.status==='approved').length,'카드와 AI 활성 시 노출')}</div><div class="v3-grid2"><section class="v3-card"><div class="section-head"><h2>배치 검토</h2>${goBtn('전체 보기','publisher/requests','btn-ghost','arrow')}</div>${placementRows3()}<div class="v3-privacy">${icon('shield','i16')}사업자 승인 카드만 검토합니다. 독자의 개인정보와 고객 대화는 열람할 수 없습니다.</div></section><aside class="v3-card"><h2>독자가 보게 될 화면</h2><p>기사 안에서 안내받고, 문의를 남길 때 사업자 접수 화면으로 이동합니다.</p><div class="v3-article-art mt24" style="height:150px">LOCAL LIFE<br>작은 일상의 새로운 선택</div>${btn('독자 화면 체험','v3-current-article','btn-primary wfull mt24','external')}</aside></div>`;
